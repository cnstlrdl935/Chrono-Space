<!DOCTYPE html>
<html lang="ko">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>시간 도구</title>


  <style>

    /* =========================================
       기본 색상 변수
    ========================================= */

    :root {

      --bg-color: #eef2ff;

      --text-color: #334155;

      --title-color: #334155;

      --display-color: #334155;

      --sidebar-bg: rgba(255, 255, 255, 0.42);

      --sidebar-border: rgba(255, 255, 255, 0.35);

      --button-bg: rgba(255, 255, 255, 0.48);

      --button-text: #334155;

      --active-bg: rgba(79, 70, 229, 0.78);

      --active-text: #ffffff;

      --screen-bg: rgba(255, 255, 255, 0.48);

      --input-bg: rgba(255, 255, 255, 0.55);

      --input-border: rgba(51, 65, 85, 0.25);

      --setting-bg: rgba(255, 255, 255, 0.35);

      --shadow: rgba(30, 41, 59, 0.12);

    }


    /* =========================================
       전체 기본 설정
    ========================================= */

    * {

      box-sizing: border-box;

    }


    html {

      width: 100%;

      min-height: 100%;

    }


    body {

      margin: 0;

      width: 100%;

      min-height: 100vh;

      font-family:
        Arial,
        "Noto Sans KR",
        sans-serif;

      background:
        var(--bg-color);

      color:
        var(--text-color);

      transition:
        background 0.3s ease,
        color 0.3s ease;

      overflow-x: hidden;

    }


    /* =========================================
       전체 레이아웃
    ========================================= */

    .layout {

      display: flex;

      width: 100%;

      min-height: 100vh;

    }


    /* =========================================
       왼쪽 작업 표시줄
    ========================================= */

    .sidebar {

      width: 210px;

      flex-shrink: 0;

      min-height: 100vh;

      padding: 25px 15px;

      background:
        var(--sidebar-bg);

      backdrop-filter:
        blur(15px);

      -webkit-backdrop-filter:
        blur(15px);

      border-right:
        1px solid var(--sidebar-border);

      box-shadow:
        3px 0 20px var(--shadow);

      display: flex;

      flex-direction: column;

      gap: 10px;

      transition:
        background 0.3s ease;

    }


    /* =========================================
       로고
    ========================================= */

    .logo {

      font-size: 22px;

      font-weight: bold;

      text-align: center;

      color:
        var(--title-color);

      margin-bottom: 20px;

      transition:
        color 0.3s ease;

    }


    /* =========================================
       왼쪽 메뉴 버튼
    ========================================= */

    .menu-button {

      width: 100%;

      border: none;

      background:
        var(--button-bg);

      color:
        var(--button-text);

      padding: 14px 15px;

      border-radius: 12px;

      font-size: 16px;

      font-weight: 600;

      cursor: pointer;

      text-align: center;

      transition:
        background 0.2s ease,
        color 0.2s ease,
        transform 0.2s ease;

    }


    .menu-button:hover {

      transform:
        translateY(-1px);

    }


    .menu-button.active {

      background:
        var(--active-bg);

      color:
        var(--active-text);

    }


    /* =========================================
       메인 영역
    ========================================= */

    .main {

      flex: 1;

      min-width: 0;

      min-height: 100vh;

      padding: 30px;

      display: flex;

      justify-content: center;

      align-items: center;

    }


    /* =========================================
       각 화면
    ========================================= */

    .screen {

      display: none;

      position: relative;

      width: 100%;

      max-width: 760px;

      min-height: 500px;

      padding: 55px 35px;

      border-radius: 24px;

      background:
        var(--screen-bg);

      backdrop-filter:
        blur(15px);

      -webkit-backdrop-filter:
        blur(15px);

      box-shadow:
        0 15px 40px var(--shadow);

      text-align: center;

      color:
        var(--text-color);

      transition:
        background 0.3s ease,
        color 0.3s ease;

    }


    .screen.active {

      display: flex;

      flex-direction: column;

      justify-content: center;

      align-items: center;

    }


    /* =========================================
       제목
    ========================================= */

    .screen h1 {

      margin:
        0 0 20px 0;

      font-size: 30px;

      color:
        var(--title-color);

      transition:
        color 0.3s ease;

    }


    /* =========================================
       날짜
    ========================================= */

    .date {

      position: absolute;

      top: 25px;

      left: 30px;

      font-size: 15px;

      color:
        var(--text-color);

      font-weight: 500;

      text-align: left;

      transition:
        color 0.3s ease;

    }


    /* =========================================
       시간대
    ========================================= */

    .timezone-box {

      margin:
        0 0 10px 0;

      display: flex;

      flex-direction: column;

      align-items: center;

    }


    .timezone-box label {

      margin-bottom: 8px;

      color:
        var(--text-color);

      font-size: 14px;

    }


    .timezone-box select {

      padding: 11px 15px;

      border:
        1px solid var(--input-border);

      border-radius: 10px;

      background:
        var(--input-bg);

      color:
        var(--text-color);

      font-size: 15px;

      cursor: pointer;

      outline: none;

    }


    /* =========================================
       시간 표시
    ========================================= */

    .display {

      font-family:
        monospace;

      font-size: 62px;

      font-weight: bold;

      color:
        var(--display-color);

      margin:
        30px 0;

      white-space: nowrap;

      text-align: center;

      transition:
        color 0.3s ease;

    }


    /* =========================================
       타이머 입력 영역
    ========================================= */

    .timer-inputs {

      display: flex;

      justify-content: center;

      align-items: center;

      gap: 12px;

      margin:
        5px 0 25px;

    }


    .timer-input-box {

      display: flex;

      flex-direction: column;

      align-items: center;

    }


    .timer-input-box label {

      font-size: 14px;

      margin-bottom: 7px;

      color:
        var(--text-color);

    }


    .timer-input-box input {

      width: 100px;

      padding: 14px 8px;

      font-size: 22px;

      text-align: center;

      border:
        1px solid var(--input-border);

      border-radius: 10px;

      outline: none;

      background:
        var(--input-bg);

      color:
        var(--text-color);

    }


    .timer-input-box input:focus {

      border-color:
        var(--active-bg);

    }


    /* =========================================
       타이머 콜론
    ========================================= */

    .colon {

      font-size: 30px;

      font-weight: bold;

      margin-top: 23px;

      color:
        var(--text-color);

    }


    /* =========================================
       버튼 영역
    ========================================= */

    .buttons {

      width: 100%;

      display: flex;

      justify-content: center;

      align-items: center;

      gap: 10px;

      flex-wrap: wrap;

      margin-top: 5px;

    }


    /* =========================================
       버튼
    ========================================= */

    .buttons button {

      min-width: 110px;

      border: none;

      padding: 12px 25px;

      border-radius: 11px;

      font-size: 16px;

      font-weight: 600;

      cursor: pointer;

      transition:
        0.2s ease;

    }


    /* =========================================
       시작 / 정지 버튼
    ========================================= */

    .start-button {

      background:
        var(--active-bg);

      color:
        var(--active-text);

    }


    .start-button:hover {

      filter:
        brightness(0.95);

    }


    /* =========================================
       초기화 버튼
    ========================================= */

    .reset-button {

      background:
        var(--button-bg);

      color:
        var(--button-text);

      border:
        1px solid var(--input-border) !important;

    }


    /* =========================================
       설정 화면
    ========================================= */

    .settings-screen {

      text-align: left;

    }


    .settings-title {

      text-align: center;

      margin-bottom:
        25px !important;

    }


    .setting-section {

      width: 100%;

      background:
        var(--setting-bg);

      border-radius: 16px;

      padding: 25px;

      margin-bottom: 20px;

    }


    .setting-section h2 {

      margin:
        0 0 8px 0;

      font-size: 20px;

      color:
        var(--title-color);

    }


    .setting-description {

      margin:
        0 0 20px 0;

      font-size: 14px;

      color:
        var(--text-color);

    }


    /* =========================================
       파스텔 색상 선택
    ========================================= */

    .pastel-colors {

      display: grid;

      grid-template-columns:
        repeat(5, 1fr);

      gap: 12px;

    }


    .pastel-color {

      width: 100%;

      aspect-ratio: 1 / 1;

      border-radius: 14px;

      border:
        3px solid transparent;

      cursor: pointer;

      transition:
        transform 0.15s ease,
        border-color 0.15s ease;

      box-shadow:
        0 3px 8px
        rgba(0, 0, 0, 0.08);

    }


    .pastel-color:hover {

      transform:
        scale(1.06);

    }


    .pastel-color.selected {

      border-color:
        var(--title-color);

      box-shadow:
        0 0 0 2px white,
        0 0 0 4px var(--title-color);

    }


    /* =========================================
       파스텔 색상
    ========================================= */

    .pastel-pink {

      background:
        #ffd6e0;

    }


    .pastel-peach {

      background:
        #ffe0c2;

    }


    .pastel-yellow {

      background:
        #fff1b8;

    }


    .pastel-green {

      background:
        #d8f3dc;

    }


    .pastel-mint {

      background:
        #c7f9e9;

    }


    .pastel-sky {

      background:
        #cfe8ff;

    }


    .pastel-blue {

      background:
        #d9dcff;

    }


    .pastel-purple {

      background:
        #eadcff;

    }


    .pastel-lavender {

      background:
        #f0ddff;

    }


    .pastel-cream {

      background:
        #fff7df;

    }


    /* =========================================
       기본색 버튼
    ========================================= */

    .default-background-button {

      display: block;

      margin:
        20px auto 0;

      border: none;

      background:
        var(--button-bg);

      color:
        var(--button-text);

      padding:
        11px 18px;

      border-radius:
        10px;

      font-size:
        14px;

      cursor:
        pointer;

    }


    /* =========================================
       언어 선택
    ========================================= */

    .language-select {

      width:
        100%;

      padding:
        13px 15px;

      border:
        1px solid var(--input-border);

      border-radius:
        10px;

      background:
        var(--input-bg);

      color:
        var(--text-color);

      font-size:
        15px;

      cursor:
        pointer;

      outline:
        none;

    }


    /* =========================================
       모바일
    ========================================= */

    @media (max-width: 700px) {


      .layout {

        flex-direction:
          column;

      }


      .sidebar {

        width:
          100%;

        min-height:
          auto;

        padding:
          12px;

        flex-direction:
          row;

        flex-wrap:
          wrap;

        align-items:
          center;

      }


      .logo {

        width:
          100%;

        margin-bottom:
          5px;

      }


      .menu-button {

        flex:
          1;

        min-width:
          70px;

        text-align:
          center;

        padding:
          10px 8px;

        font-size:
          14px;

      }


      .main {

        min-height:
          calc(100vh - 100px);

        padding:
          15px;

      }


      .screen {

        min-height:
          450px;

        padding:
          55px 15px 40px;

      }


      .display {

        font-size:
          42px;

      }


      .timer-inputs {

        gap:
          5px;

      }


      .timer-input-box input {

        width:
          80px;

        font-size:
          20px;

      }


      .pastel-colors {

        gap:
          8px;

      }

    }


    /* =========================================
       아주 작은 화면
    ========================================= */

    @media (max-width: 400px) {


      .display {

        font-size:
          34px;

      }


      .timer-input-box input {

        width:
          65px;

      }


      .timer-inputs {

        gap:
          2px;

      }

    }

  </style>

</head>


<body>


  <div class="layout">


    <!-- =====================================
         왼쪽 메뉴
    ====================================== -->

    <aside class="sidebar">


      <div
        id="logo"
        class="logo">

        시간 도구

      </div>


      <button
        id="clockButton"
        class="menu-button active"
        onclick="showScreen('clock')">

        현재시간

      </button>


      <button
        id="timerButton"
        class="menu-button"
        onclick="showScreen('timer')">

        타이머

      </button>


      <button
        id="stopwatchButton"
        class="menu-button"
        onclick="showScreen('stopwatch')">

        초시계

      </button>


      <button
        id="settingsButton"
        class="menu-button"
        onclick="showScreen('settings')">

        설정

      </button>


    </aside>



    <!-- =====================================
         메인
    ====================================== -->

    <main class="main">


      <!-- =================================
           현재시간
      ================================== -->

      <section
        id="clock"
        class="screen active">


        <div
          id="dateDisplay"
          class="date">

          날짜

        </div>


        <h1 id="clockTitle">

          현재시간

        </h1>


        <div class="timezone-box">


          <label
            id="timezoneLabel"
            for="timezone">

            시간대

          </label>


          <select
            id="timezone"
            onchange="updateClock()">


            <option value="Asia/Seoul">

              대한민국 (서울)

            </option>


            <option value="Asia/Tokyo">

              일본 (도쿄)

            </option>


            <option value="America/New_York">

              미국 (뉴욕)

            </option>


            <option value="America/Los_Angeles">

              미국 (로스앤젤레스)

            </option>


            <option value="Europe/London">

              영국 (런던)

            </option>


            <option value="Europe/Paris">

              프랑스 (파리)

            </option>


            <option value="Asia/Shanghai">

              중국 (상하이)

            </option>


            <option value="Australia/Sydney">

              호주 (시드니)

            </option>


          </select>


        </div>


        <div
          id="clockDisplay"
          class="display">

          00:00:00

        </div>


      </section>



      <!-- =================================
           타이머
      ================================== -->

      <section
        id="timer"
        class="screen">


        <h1 id="timerTitle">

          타이머

        </h1>


        <div
          id="timerDisplay"
          class="display">

          00:00:00

        </div>


        <div class="timer-inputs">


          <div class="timer-input-box">


            <label
              id="hoursLabel"
              for="timerHours">

              시간

            </label>


            <input
              type="number"
              id="timerHours"
              min="0"
              max="23"
              value="0">


          </div>


          <div class="colon">

            :

          </div>


          <div class="timer-input-box">


            <label
              id="minutesLabel"
              for="timerMinutes">

              분

            </label>


            <input
              type="number"
              id="timerMinutes"
              min="0"
              max="59"
              value="0">


          </div>


          <div class="colon">

            :

          </div>


          <div class="timer-input-box">


            <label
              id="secondsLabel"
              for="timerSeconds">

              초

            </label>


            <input
              type="number"
              id="timerSeconds"
              min="0"
              max="59"
              value="0">


          </div>


        </div>


        <div class="buttons">


          <button
            id="timerStartButton"
            class="start-button"
            onclick="toggleTimer()">

            시작

          </button>


          <button
            id="timerResetButton"
            class="reset-button"
            onclick="resetTimer()">

            초기화

          </button>


        </div>


      </section>



      <!-- =================================
           초시계
      ================================== -->

      <section
        id="stopwatch"
        class="screen">


        <h1 id="stopwatchTitle">

          초시계

        </h1>


        <div
          id="stopwatchDisplay"
          class="display">

          00:00:00

        </div>


        <div class="buttons">


          <button
            id="stopwatchStartButton"
            class="start-button"
            onclick="toggleStopwatch()">

            시작

          </button>


          <button
            id="stopwatchResetButton"
            class="reset-button"
            onclick="resetStopwatch()">

            초기화

          </button>


        </div>


      </section>



      <!-- =================================
           설정
      ================================== -->

      <section
        id="settings"
        class="screen settings-screen">


        <h1
          id="settingsTitle"
          class="settings-title">

          설정

        </h1>


        <!-- 배경색 -->

        <div class="setting-section">


          <h2 id="backgroundTitle">

            배경색

          </h2>


          <p
            id="backgroundDescription"
            class="setting-description">

            파스텔톤 색상 중에서 원하는 배경색을 선택하세요.

          </p>


          <div class="pastel-colors">


            <button
              class="pastel-color pastel-pink"
              data-color="#ffd6e0"
              onclick="setBackgroundColor('#ffd6e0', this)"
              aria-label="핑크">
            </button>


            <button
              class="pastel-color pastel-peach"
              data-color="#ffe0c2"
              onclick="setBackgroundColor('#ffe0c2', this)"
              aria-label="피치">
            </button>


            <button
              class="pastel-color pastel-yellow"
              data-color="#fff1b8"
              onclick="setBackgroundColor('#fff1b8', this)"
              aria-label="노랑">
            </button>


            <button
              class="pastel-color pastel-green"
              data-color="#d8f3dc"
              onclick="setBackgroundColor('#d8f3dc', this)"
              aria-label="초록">
            </button>


            <button
              class="pastel-color pastel-mint"
              data-color="#c7f9e9"
              onclick="setBackgroundColor('#c7f9e9', this)"
              aria-label="민트">
            </button>


            <button
              class="pastel-color pastel-sky"
              data-color="#cfe8ff"
              onclick="setBackgroundColor('#cfe8ff', this)"
              aria-label="하늘색">
            </button>


            <button
              class="pastel-color pastel-blue"
              data-color="#d9dcff"
              onclick="setBackgroundColor('#d9dcff', this)"
              aria-label="파랑">
            </button>


            <button
              class="pastel-color pastel-purple"
              data-color="#eadcff"
              onclick="setBackgroundColor('#eadcff', this)"
              aria-label="보라">
            </button>


            <button
              class="pastel-color pastel-lavender"
              data-color="#f0ddff"
              onclick="setBackgroundColor('#f0ddff', this)"
              aria-label="라벤더">
            </button>


            <button
              class="pastel-color pastel-cream"
              data-color="#fff7df"
              onclick="setBackgroundColor('#fff7df', this)"
              aria-label="크림">
            </button>


          </div>


          <button
            id="defaultBackgroundButton"
            class="default-background-button"
            onclick="resetBackgroundColor()">

            기본색으로 초기화

          </button>


        </div>



        <!-- 언어 -->

        <div class="setting-section">


          <h2 id="languageTitle">

            언어

          </h2>


          <p
            id="languageDescription"
            class="setting-description">

            사용할 언어를 선택하세요.

          </p>


          <select
            id="languageSelect"
            class="language-select"
            onchange="changeLanguage()">


            <option value="ko">

              한국어

            </option>


            <option value="en">

              English

            </option>


            <option value="ja">

              日本語

            </option>


          </select>


        </div>


      </section>


    </main>

  </div>



  <script>


    /* =========================================
       언어
    ========================================= */

    const translations = {


      ko: {

        title: "시간 도구",

        clock: "현재시간",

        timer: "타이머",

        stopwatch: "초시계",

        settings: "설정",

        timezone: "시간대",

        hours: "시간",

        minutes: "분",

        seconds: "초",

        start: "시작",

        stop: "정지",

        reset: "초기화",

        background: "배경색",

        backgroundDescription:
          "파스텔톤 색상 중에서 원하는 배경색을 선택하세요.",

        defaultBackground:
          "기본색으로 초기화",

        language: "언어",

        languageDescription:
          "사용할 언어를 선택하세요.",

        timerAlert:
          "타이머 시간을 설정해주세요.",

        timerRangeAlert:
          "시간은 0~23, 분과 초는 0~59 사이로 입력해주세요.",

        timerFinished:
          "타이머가 끝났습니다!"

      },


      en: {

        title: "Time Tools",

        clock: "Current Time",

        timer: "Timer",

        stopwatch: "Stopwatch",

        settings: "Settings",

        timezone: "Time Zone",

        hours: "Hours",

        minutes: "Minutes",

        seconds: "Seconds",

        start: "Start",

        stop: "Stop",

        reset: "Reset",

        background: "Background",

        backgroundDescription:
          "Choose a pastel background color.",

        defaultBackground:
          "Reset to Default",

        language: "Language",

        languageDescription:
          "Choose your language.",

        timerAlert:
          "Please set a timer.",

        timerRangeAlert:
          "Hours must be 0–23 and minutes and seconds must be 0–59.",

        timerFinished:
          "The timer is finished!"

      },


      ja: {

        title: "時間ツール",

        clock: "現在時刻",

        timer: "タイマー",

        stopwatch: "ストップウォッチ",

        settings: "設定",

        timezone: "タイムゾーン",

        hours: "時間",

        minutes: "分",

        seconds: "秒",

        start: "開始",

        stop: "停止",

        reset: "リセット",

        background: "背景色",

        backgroundDescription:
          "パステルカラーから背景色を選択してください。",

        defaultBackground:
          "デフォルトに戻す",

        language: "言語",

        languageDescription:
          "使用する言語を選択してください。",

        timerAlert:
          "タイマー時間を設定してください。",

        timerRangeAlert:
          "時間は0～23、分と秒は0～59の範囲で入力してください。",

        timerFinished:
          "タイマーが終了しました！"

      }

    };


    let currentLanguage =
      localStorage.getItem("language") || "ko";


    /* =========================================
       배경색
    ========================================= */

    const defaultBackgroundColor =
      "#eef2ff";


    const backgroundTextColors = {


      "#ffd6e0":
        "#6b3a47",


      "#ffe0c2":
        "#6b4935",


      "#fff1b8":
        "#665a25",


      "#d8f3dc":
        "#31543a",


      "#c7f9e9":
        "#285449",


      "#cfe8ff":
        "#31506b",


      "#d9dcff":
        "#41446b",


      "#eadcff":
        "#57416b",


      "#f0ddff":
        "#5d4770",


      "#fff7df":
        "#665d42",


      "#eef2ff":
        "#334155"

    };


    /* =========================================
       배경색 변경
    ========================================= */

    function setBackgroundColor(
      color,
      selectedButton
    ) {


      const textColor =
        backgroundTextColors[color]
        || "#334155";


      document.documentElement.style.setProperty(
        "--bg-color",
        color
      );


      document.documentElement.style.setProperty(
        "--text-color",
        textColor
      );


      document.documentElement.style.setProperty(
        "--title-color",
        textColor
      );


      document.documentElement.style.setProperty(
        "--display-color",
        textColor
      );


      document.documentElement.style.setProperty(
        "--button-text",
        textColor
      );


      /*
        활성 버튼도 배경에 어울리도록
        약간 진하게 설정
      */

      document.documentElement.style.setProperty(
        "--active-bg",
        textColor
      );


      document.documentElement.style.setProperty(
        "--active-text",
        "#ffffff"
      );


      document
        .querySelectorAll(".pastel-color")
        .forEach(function(button) {

          button.classList.remove(
            "selected"
          );

        });


      if (selectedButton) {

        selectedButton.classList.add(
          "selected"
        );

      }


      localStorage.setItem(
        "backgroundColor",
        color
      );

    }


    /* =========================================
       기본 배경
    ========================================= */

    function resetBackgroundColor() {


      setBackgroundColor(
        defaultBackgroundColor,
        null
      );

    }


    /* =========================================
       저장된 배경 불러오기
    ========================================= */

    const savedColor =
      localStorage.getItem(
        "backgroundColor"
      );


    if (savedColor) {


      const savedButton =
        document.querySelector(
          '.pastel-color[data-color="' +
          savedColor +
          '"]'
        );


      setBackgroundColor(
        savedColor,
        savedButton
      );

    }

    else {


      setBackgroundColor(
        defaultBackgroundColor,
        null
      );

    }


    /* =========================================
       화면 전환
    ========================================= */

    function showScreen(
      screenName
    ) {


      document
        .querySelectorAll(".screen")
        .forEach(function(screen) {

          screen.classList.remove(
            "active"
          );

        });


      document
        .querySelectorAll(".menu-button")
        .forEach(function(button) {

          button.classList.remove(
            "active"
          );

        });


      document
        .getElementById(screenName)
        .classList.add("active");


      document
        .getElementById(
          screenName + "Button"
        )
        .classList.add("active");

    }


    /* =========================================
       현재시간
    ========================================= */

    function updateClock() {


      const timezone =
        document
          .getElementById("timezone")
          .value;


      const now =
        new Date();


      let locale;


      if (currentLanguage === "ko") {

        locale = "ko-KR";

      }

      else if (
        currentLanguage === "ja"
      ) {

        locale = "ja-JP";

      }

      else {

        locale = "en-US";

      }


      const timeText =
        new Intl.DateTimeFormat(
          locale,
          {

            timeZone:
              timezone,

            hour:
              "2-digit",

            minute:
              "2-digit",

            second:
              "2-digit",

            hour12:
              currentLanguage === "en"

          }
        ).format(now);


      document
        .getElementById(
          "clockDisplay"
        )
        .textContent =
        timeText;


      const dateText =
        new Intl.DateTimeFormat(
          locale,
          {

            timeZone:
              timezone,

            year:
              "numeric",

            month:
              "long",

            day:
              "numeric",

            weekday:
              "long"

          }
        ).format(now);


      document
        .getElementById(
          "dateDisplay"
        )
        .textContent =
        dateText;

    }


    updateClock();


    setInterval(
      updateClock,
      1000
    );


    /* =========================================
       타이머
    ========================================= */

    let timerTime = 0;

    let timerInterval = null;

    let timerRunning = false;


    function updateTimer() {


      const hours =
        Math.floor(
          timerTime / 3600
        );


      const minutes =
        Math.floor(
          (timerTime % 3600) / 60
        );


      const seconds =
        timerTime % 60;


      document
        .getElementById(
          "timerDisplay"
        )
        .textContent =

        String(hours)
          .padStart(2, "0")

        + ":" +

        String(minutes)
          .padStart(2, "0")

        + ":" +

        String(seconds)
          .padStart(2, "0");

    }


    updateTimer();


    /* =========================================
       타이머 시작 / 정지
    ========================================= */

    function toggleTimer() {


      const button =
        document
          .getElementById(
            "timerStartButton"
          );


      /* 정지 */

      if (timerRunning) {


        clearInterval(
          timerInterval
        );


        timerInterval = null;

        timerRunning = false;


        button.textContent =
          translations[
            currentLanguage
          ].start;


        return;

      }


      /* 새로운 타이머 시작 */

      if (timerTime === 0) {


        const hours =
          Number(
            document
              .getElementById(
                "timerHours"
              )
              .value
          );


        const minutes =
          Number(
            document
              .getElementById(
                "timerMinutes"
              )
              .value
          );


        const seconds =
          Number(
            document
              .getElementById(
                "timerSeconds"
              )
              .value
          );


        if (
          hours < 0 ||
          hours > 23 ||
          minutes < 0 ||
          minutes > 59 ||
          seconds < 0 ||
          seconds > 59
        ) {


          alert(
            translations[
              currentLanguage
            ].timerRangeAlert
          );


          return;

        }


        if (
          hours === 0 &&
          minutes === 0 &&
          seconds === 0
        ) {


          alert(
            translations[
              currentLanguage
            ].timerAlert
          );


          return;

        }


        timerTime =

          hours * 3600 +

          minutes * 60 +

          seconds;


        updateTimer();

      }


      timerRunning = true;


      button.textContent =
        translations[
          currentLanguage
        ].stop;


      timerInterval =
        setInterval(function() {


          timerTime--;


          updateTimer();


          if (timerTime <= 0) {


            clearInterval(
              timerInterval
            );


            timerInterval = null;


            timerRunning = false;


            timerTime = 0;


            button.textContent =
              translations[
                currentLanguage
              ].start;


            updateTimer();


            alert(
              translations[
                currentLanguage
              ].timerFinished
            );

          }


        }, 1000);

    }


    /* =========================================
       타이머 초기화
    ========================================= */

    function resetTimer() {


      clearInterval(
        timerInterval
      );


      timerInterval = null;


      timerRunning = false;


      timerTime = 0;


      document
        .getElementById(
          "timerHours"
        )
        .value = 0;


      document
        .getElementById(
          "timerMinutes"
        )
        .value = 0;


      document
        .getElementById(
          "timerSeconds"
        )
        .value = 0;


      document
        .getElementById(
          "timerStartButton"
        )
        .textContent =
        translations[
          currentLanguage
        ].start;


      updateTimer();

    }


    /* =========================================
       초시계
    ========================================= */

    let stopwatchRunning =
      false;

    let stopwatchStartTime =
      0;

    let stopwatchElapsed =
      0;

    let stopwatchAnimation =
      null;


    /* =========================================
       초시계 표시
    ========================================= */

    function updateStopwatch() {


      let totalMilliseconds;


      if (stopwatchRunning) {


        totalMilliseconds =

          stopwatchElapsed +

          (
            performance.now() -
            stopwatchStartTime
          );

      }

      else {


        totalMilliseconds =
          stopwatchElapsed;

      }


      const oneHour =
        60 * 60 * 1000;


      let displayText;


      /* 1시간 미만
         분 : 초 : 밀리초
      */

      if (
        totalMilliseconds <
        oneHour
      ) {


        const minutes =
          Math.floor(
            totalMilliseconds /
            60000
          );


        const seconds =
          Math.floor(
            (totalMilliseconds %
              60000) /
            1000
          );


        const milliseconds =
          Math.floor(
            (totalMilliseconds %
              1000) /
            10
          );


        displayText =

          String(minutes)
            .padStart(2, "0")

          + ":" +

          String(seconds)
            .padStart(2, "0")

          + ":" +

          String(milliseconds)
            .padStart(2, "0");

      }


      /* 1시간 이상
         시간 : 분 : 초
      */

      else {


        const hours =
          Math.floor(
            totalMilliseconds /
            3600000
          );


        const minutes =
          Math.floor(
            (totalMilliseconds %
              3600000) /
            60000
          );


        const seconds =
          Math.floor(
            (totalMilliseconds %
              60000) /
            1000
          );


        displayText =

          String(hours)
            .padStart(2, "0")

          + ":" +

          String(minutes)
            .padStart(2, "0")

          + ":" +

          String(seconds)
            .padStart(2, "0");

      }


      document
        .getElementById(
          "stopwatchDisplay"
        )
        .textContent =
        displayText;


      if (stopwatchRunning) {


        stopwatchAnimation =
          requestAnimationFrame(
            updateStopwatch
          );

      }

    }


    /* =========================================
       초시계 시작 / 정지
    ========================================= */

    function toggleStopwatch() {


      const button =
        document
          .getElementById(
            "stopwatchStartButton"
          );


      /* 정지 */

      if (stopwatchRunning) {


        stopwatchElapsed +=

          performance.now() -
          stopwatchStartTime;


        stopwatchRunning =
          false;


        stopwatchStartTime =
          0;


        if (
          stopwatchAnimation !== null
        ) {


          cancelAnimationFrame(
            stopwatchAnimation
          );


          stopwatchAnimation =
            null;

        }


        button.textContent =
          translations[
            currentLanguage
          ].start;


        updateStopwatch();


        return;

      }


      /* 시작 */

      stopwatchRunning =
        true;


      stopwatchStartTime =
        performance.now();


      button.textContent =
        translations[
          currentLanguage
        ].stop;


      updateStopwatch();

    }


    /* =========================================
       초시계 초기화
    ========================================= */

    function resetStopwatch() {


      if (
        stopwatchAnimation !== null
      ) {


        cancelAnimationFrame(
          stopwatchAnimation
        );


        stopwatchAnimation =
          null;

      }


      stopwatchRunning =
        false;


      stopwatchStartTime =
        0;


      stopwatchElapsed =
        0;


      document
        .getElementById(
          "stopwatchStartButton"
        )
        .textContent =
        translations[
          currentLanguage
        ].start;


      document
        .getElementById(
          "stopwatchDisplay"
        )
        .textContent =
        "00:00:00";

    }


    /* =========================================
       언어 변경
    ========================================= */

    function changeLanguage() {


      currentLanguage =
        document
          .getElementById(
            "languageSelect"
          )
          .value;


      localStorage.setItem(
        "language",
        currentLanguage
      );


      applyLanguage();

    }


    /* =========================================
       언어 적용
    ========================================= */

    function applyLanguage() {


      const t =
        translations[
          currentLanguage
        ];


      document.documentElement.lang =
        currentLanguage;


      /* 메뉴 */

      document
        .getElementById(
          "logo"
        )
        .textContent =
        t.title;


      document
        .getElementById(
          "clockButton"
        )
        .textContent =
        t.clock;


      document
        .getElementById(
          "timerButton"
        )
        .textContent =
        t.timer;


      document
        .getElementById(
          "stopwatchButton"
        )
        .textContent =
        t.stopwatch;


      document
        .getElementById(
          "settingsButton"
        )
        .textContent =
        t.settings;


      /* 현재시간 */

      document
        .getElementById(
          "clockTitle"
        )
        .textContent =
        t.clock;


      document
        .getElementById(
          "timezoneLabel"
        )
        .textContent =
        t.timezone;


      /* 타이머 */

      document
        .getElementById(
          "timerTitle"
        )
        .textContent =
        t.timer;


      document
        .getElementById(
          "hoursLabel"
        )
        .textContent =
        t.hours;


      document
        .getElementById(
          "minutesLabel"
        )
        .textContent =
        t.minutes;


      document
        .getElementById(
          "secondsLabel"
        )
        .textContent =
        t.seconds;


      document
        .getElementById(
          "timerResetButton"
        )
        .textContent =
        t.reset;


      if (timerRunning) {


        document
          .getElementById(
            "timerStartButton"
          )
          .textContent =
          t.stop;

      }

      else {


        document
          .getElementById(
            "timerStartButton"
          )
          .textContent =
          t.start;

      }


      /* 초시계 */

      document
        .getElementById(
          "stopwatchTitle"
        )
        .textContent =
        t.stopwatch;


      document
        .getElementById(
          "stopwatchResetButton"
        )
        .textContent =
        t.reset;


      if (stopwatchRunning) {


        document
          .getElementById(
            "stopwatchStartButton"
          )
          .textContent =
          t.stop;

      }

      else {


        document
          .getElementById(
            "stopwatchStartButton"
          )
          .textContent =
          t.start;

      }


      /* 설정 */

      document
        .getElementById(
          "settingsTitle"
        )
        .textContent =
        t.settings;


      document
        .getElementById(
          "backgroundTitle"
        )
        .textContent =
        t.background;


      document
        .getElementById(
          "backgroundDescription"
        )
        .textContent =
        t.backgroundDescription;


      document
        .getElementById(
          "defaultBackgroundButton"
        )
        .textContent =
        t.defaultBackground;


      document
        .getElementById(
          "languageTitle"
        )
        .textContent =
        t.language;


      document
        .getElementById(
          "languageDescription"
        )
        .textContent =
        t.languageDescription;


      updateClock();

    }


    /* =========================================
       저장된 언어 불러오기
    ========================================= */

    document
      .getElementById(
        "languageSelect"
      )
      .value =
      currentLanguage;


    applyLanguage();

  </script>


</body>

</html>
