<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0">

<title>ChronoSpace</title>


<style>

/* ==================================================
   기본 변수
================================================== */

:root {

  --bg-color: #eef2ff;

  --text-color: #334155;

  --title-color: #334155;

  --display-color: #334155;

  --sidebar-bg: #ffffff;

  --sidebar-border: #e5e7eb;

  --button-bg: #d9dcff;

  --button-text: #334155;

  --active-bg: #7c83d9;

  --active-text: #ffffff;

  --screen-bg: rgba(255,255,255,0.48);

  --input-bg: rgba(255,255,255,0.72);

  --input-border: rgba(51,65,85,0.22);

  --setting-bg: rgba(255,255,255,0.40);

  --shadow: rgba(30,41,59,0.12);
}


/* ==================================================
   전체
================================================== */

* {
  box-sizing: border-box;
}


html {

  width: 100%;

  min-height: 100%;
}


body {

  margin: 0;

  width: 100%;

  min-height: 100vh;

  font-family:
    Arial,
    "Noto Sans KR",
    sans-serif;

  background:
    var(--bg-color);

  color:
    var(--text-color);

  overflow-x: hidden;

  transition:
    background 0.3s ease;
}


/* ==================================================
   레이아웃
================================================== */

.layout {

  display: flex;

  width: 100%;

  min-height: 100vh;
}


/* ==================================================
   왼쪽 메뉴
================================================== */

.sidebar {

  width: 210px;

  flex-shrink: 0;

  min-height: 100vh;

  padding: 25px 15px;

  background: #ffffff;

  border-right:
    1px solid var(--sidebar-border);

  box-shadow:
    3px 0 20px var(--shadow);

  display: flex;

  flex-direction: column;

  gap: 10px;

  z-index: 100;
}


.logo {

  font-size: 22px;

  font-weight: bold;

  text-align: center;

  color: #334155;

  margin-bottom: 20px;

  letter-spacing: 0.5px;
}


/* ==================================================
   메뉴 버튼
================================================== */

.menu-button {

  width: 100%;

  border: none;

  background:
    var(--button-bg);

  color:
    var(--button-text);

  padding: 14px 15px;

  border-radius: 12px;

  font-size: 16px;

  font-weight: 600;

  cursor: pointer;

  text-align: center;

  transition:
    background 0.2s ease,
    color 0.2s ease,
    transform 0.2s ease;
}


.menu-button:hover {

  transform:
    translateY(-1px);
}


.menu-button.active {

  background:
    var(--active-bg);

  color:
    var(--active-text);
}


/* ==================================================
   메인
================================================== */

.main {

  flex: 1;

  min-width: 0;

  min-height: 100vh;

  padding: 30px;

  display: flex;

  justify-content: center;

  align-items: center;

  background:
    var(--bg-color);

  transition:
    background 0.3s ease;
}


/* ==================================================
   화면
================================================== */

.screen {

  display: none;

  position: relative;

  width: 100%;

  max-width: 760px;

  min-height: 500px;

  padding: 70px 35px 55px;

  border-radius: 24px;

  background:
    var(--screen-bg);

  backdrop-filter:
    blur(15px);

  -webkit-backdrop-filter:
    blur(15px);

  box-shadow:
    0 15px 40px var(--shadow);

  text-align: center;

  color:
    var(--text-color);
}


.screen.active {

  display: flex;

  flex-direction: column;

  justify-content: center;

  align-items: center;
}


/* ==================================================
   전체화면
================================================== */

.screen:fullscreen {

  width: 100vw;

  height: 100vh;

  max-width: none;

  min-height: 100vh;

  border-radius: 0;

  background:
    var(--bg-color);

  box-shadow: none;

  padding: 30px;

  display: flex;

  flex-direction: column;

  justify-content: center;

  align-items: center;

  text-align: center;
}


.screen:fullscreen h1 {

  font-size: 40px;

  margin-bottom: 20px;
}


.screen:fullscreen .display {

  font-size:
    clamp(50px, 10vw, 110px);

  margin: 20px 0;
}


/* ==================================================
   전체화면 버튼
================================================== */

.fullscreen-button {

  position: absolute;

  top: 20px;

  right: 20px;

  border: none;

  background:
    var(--button-bg);

  color:
    var(--button-text);

  padding:
    9px 14px;

  border-radius:
    9px;

  font-size:
    13px;

  font-weight:
    600;

  cursor:
    pointer;

  transition:
    0.2s ease;

  z-index: 20;
}


.fullscreen-button:hover {

  transform:
    scale(1.04);

  filter:
    brightness(0.95);
}


/* ==================================================
   제목
================================================== */

.screen h1 {

  margin:
    0 0 20px 0;

  font-size:
    30px;

  color:
    var(--title-color);
}


/* ==================================================
   시간대
================================================== */

.timezone-box {

  margin:
    0 0 10px 0;

  display:
    flex;

  flex-direction:
    column;

  align-items:
    center;
}


.timezone-box label {

  margin-bottom:
    8px;

  color:
    var(--text-color);

  font-size:
    14px;
}


.timezone-box select {

  padding:
    11px 15px;

  border:
    1px solid var(--input-border);

  border-radius:
    10px;

  background:
    var(--input-bg);

  color:
    var(--text-color);

  font-size:
    15px;

  cursor:
    pointer;

  outline:
    none;

  max-width:
    300px;
}


/* ==================================================
   현재시간 묶음
================================================== */

.clock-content {

  display:
    flex;

  flex-direction:
    column;

  align-items:
    center;

  justify-content:
    center;

  text-align:
    center;
}


/* ==================================================
   표시
================================================== */

.display {

  font-family:
    monospace;

  font-size:
    62px;

  font-weight:
    bold;

  color:
    var(--display-color);

  margin:
    30px 0;

  white-space:
    nowrap;

  text-align:
    center;
}


/* ==================================================
   날짜
================================================== */

.date {

  position: static;

  margin-top:
    -15px;

  font-size:
    16px;

  color:
    var(--text-color);

  font-weight:
    500;

  text-align:
    center;
}


/* ==================================================
   타이머 입력
================================================== */

.timer-inputs {

  display:
    flex;

  justify-content:
    center;

  align-items:
    center;

  gap:
    12px;

  margin:
    5px 0 25px;
}


.timer-input-box {

  display:
    flex;

  flex-direction:
    column;

  align-items:
    center;
}


.timer-input-box label {

  font-size:
    14px;

  margin-bottom:
    7px;

  color:
    var(--text-color);
}


.timer-input-box input {

  width:
    100px;

  padding:
    14px 8px;

  font-size:
    22px;

  text-align:
    center;

  border:
    1px solid var(--input-border);

  border-radius:
    10px;

  outline:
    none;

  background:
    var(--input-bg);

  color:
    var(--text-color);
}


.timer-input-box input:focus {

  border-color:
    var(--active-bg);
}


/* ==================================================
   콜론
================================================== */

.colon {

  font-size:
    30px;

  font-weight:
    bold;

  margin-top:
    23px;

  color:
    var(--text-color);
}


/* ==================================================
   버튼
================================================== */

.buttons {

  width:
    100%;

  display:
    flex;

  justify-content:
    center;

  align-items:
    center;

  gap:
    10px;

  flex-wrap:
    wrap;

  margin-top:
    5px;
}


.buttons button {

  min-width:
    110px;

  border:
    none;

  padding:
    12px 25px;

  border-radius:
    11px;

  font-size:
    16px;

  font-weight:
    600;

  cursor:
    pointer;

  transition:
    0.2s ease;
}


.start-button {

  background:
    var(--active-bg);

  color:
    var(--active-text);
}


.start-button:hover {

  filter:
    brightness(0.94);
}


.reset-button {

  background:
    var(--button-bg);

  color:
    var(--button-text);

  border:
    1px solid var(--input-border) !important;
}


/* ==================================================
   설정
================================================== */

.settings-screen {

  text-align:
    left;

  overflow-y:
    auto;
}


.settings-title {

  text-align:
    center;

  margin-bottom:
    25px !important;
}


.setting-section {

  width:
    100%;

  background:
    var(--setting-bg);

  border-radius:
    16px;

  padding:
    25px;

  margin-bottom:
    20px;
}


.setting-section h2 {

  margin:
    0 0 8px 0;

  font-size:
    20px;

  color:
    var(--title-color);
}


.setting-description {

  margin:
    0 0 20px 0;

  font-size:
    14px;

  color:
    var(--text-color);
}


/* ==================================================
   파스텔 색상
================================================== */

.pastel-colors {

  display:
    grid;

  grid-template-columns:
    repeat(5, 1fr);

  gap:
    12px;
}


.pastel-color {

  width:
    100%;

  aspect-ratio:
    1 / 1;

  border-radius:
    14px;

  border:
    3px solid transparent;

  cursor:
    pointer;

  transition:
    transform 0.15s ease,
    border-color 0.15s ease;

  box-shadow:
    0 3px 8px
    rgba(0,0,0,0.08);
}


.pastel-color:hover {

  transform:
    scale(1.06);
}


.pastel-color.selected {

  border-color:
    #334155;

  box-shadow:
    0 0 0 2px white,
    0 0 0 4px #334155;
}


.pastel-pink {
  background: #ffd6e0;
}

.pastel-peach {
  background: #ffe0c2;
}

.pastel-yellow {
  background: #fff1b8;
}

.pastel-green {
  background: #d8f3dc;
}

.pastel-mint {
  background: #c7f9e9;
}

.pastel-sky {
  background: #cfe8ff;
}

.pastel-blue {
  background: #d9dcff;
}

.pastel-purple {
  background: #eadcff;
}

.pastel-lavender {
  background: #f0ddff;
}

.pastel-cream {
  background: #fff7df;
}


/* ==================================================
   기본색
================================================== */

.default-background-button {

  display:
    block;

  margin:
    20px auto 0;

  border:
    none;

  background:
    var(--button-bg);

  color:
    var(--button-text);

  padding:
    11px 18px;

  border-radius:
    10px;

  font-size:
    14px;

  cursor:
    pointer;
}


/* ==================================================
   언어
================================================== */

.language-select {

  width:
    100%;

  padding:
    13px 15px;

  border:
    1px solid var(--input-border);

  border-radius:
    10px;

  background:
    var(--input-bg);

  color:
    var(--text-color);

  font-size:
    15px;

  cursor:
    pointer;

  outline:
    none;
}


/* ==================================================
   투명 태스크바
================================================== */

.taskbar {

  position:
    fixed;

  left:
    210px;

  right:
    0;

  bottom:
    0;

  height:
    45px;

  background:
    transparent;

  border:
    none;

  box-shadow:
    none;

  pointer-events:
    none;

  z-index:
    5;
}


/* ==================================================
   모바일
================================================== */

@media (max-width:700px) {

  .layout {

    flex-direction:
      column;
  }


  .sidebar {

    width:
      100%;

    min-height:
      auto;

    padding:
      12px;

    flex-direction:
      row;

    flex-wrap:
      wrap;

    align-items:
      center;
  }


  .logo {

    width:
      100%;

    margin-bottom:
      5px;
  }


  .menu-button {

    flex:
      1;

    min-width:
      70px;

    padding:
      10px 8px;

    font-size:
      14px;
  }


  .main {

    min-height:
      calc(100vh - 100px);

    padding:
      15px;
  }


  .screen {

    min-height:
      450px;

    padding:
      60px 15px 40px;
  }


  .display {

    font-size:
      42px;
  }


  .timer-inputs {

    gap:
      5px;
  }


  .timer-input-box input {

    width:
      80px;

    font-size:
      20px;
  }


  .pastel-colors {

    gap:
      8px;
  }


  .taskbar {

    left:
      0;
  }


  .fullscreen-button {

    top:
      15px;

    right:
      15px;

    padding:
      8px 10px;
  }

}


/* ==================================================
   작은 화면
================================================== */

@media (max-width:400px) {

  .display {

    font-size:
      34px;
  }


  .timer-input-box input {

    width:
      65px;
  }


  .timer-inputs {

    gap:
      2px;
  }

}

</style>

</head>


<body>


<div class="layout">


<!-- ==================================================
     왼쪽 메뉴
================================================== -->

<aside class="sidebar">


  <div
    id="logo"
    class="logo">

    ChronoSpace

  </div>


  <button
    id="clockButton"
    class="menu-button active"
    onclick="showScreen('clock')">

    현재시간

  </button>


  <button
    id="timerButton"
    class="menu-button"
    onclick="showScreen('timer')">

    타이머

  </button>


  <button
    id="stopwatchButton"
    class="menu-button"
    onclick="showScreen('stopwatch')">

    초시계

  </button>


  <button
    id="settingsButton"
    class="menu-button"
    onclick="showScreen('settings')">

    설정

  </button>


</aside>



<main class="main">


<!-- ==================================================
     현재시간
================================================== -->

<section
  id="clock"
  class="screen active">


  <button
    id="clockFullscreenButton"
    class="fullscreen-button"
    onclick="toggleFullscreen('clock')">

    ⛶ 전체화면

  </button>


  <h1 id="clockTitle">
    현재시간
  </h1>


  <div class="timezone-box">

    <label
      id="timezoneLabel"
      for="timezone">

      시간대

    </label>


    <select
      id="timezone"
      onchange="updateClock()">


      <option value="Asia/Seoul">
        대한민국 (서울)
      </option>


      <option value="Asia/Tokyo">
        일본 (도쿄)
      </option>


      <option value="Asia/Shanghai">
        중국 (상하이)
      </option>


      <option value="Asia/Hong_Kong">
        홍콩
      </option>


      <option value="Asia/Singapore">
        싱가포르
      </option>


      <option value="Asia/Bangkok">
        태국 (방콕)
      </option>


      <option value="Asia/Jakarta">
        인도네시아 (자카르타)
      </option>


      <option value="Asia/Kolkata">
        인도 (뉴델리)
      </option>


      <option value="Asia/Dubai">
        아랍에미리트 (두바이)
      </option>


      <option value="Australia/Perth">
        호주 (퍼스)
      </option>


      <option value="Australia/Sydney">
        호주 (시드니)
      </option>


      <option value="Pacific/Auckland">
        뉴질랜드 (오클랜드)
      </option>


      <option value="Europe/London">
        영국 (런던)
      </option>


      <option value="Europe/Paris">
        프랑스 (파리)
      </option>


      <option value="Europe/Berlin">
        독일 (베를린)
      </option>


      <option value="Europe/Rome">
        이탈리아 (로마)
      </option>


      <option value="Europe/Moscow">
        러시아 (모스크바)
      </option>


      <option value="America/New_York">
        미국 (뉴욕)
      </option>


      <option value="America/Chicago">
        미국 (시카고)
      </option>


      <option value="America/Denver">
        미국 (덴버)
      </option>


      <option value="America/Los_Angeles">
        미국 (로스앤젤레스)
      </option>


      <option value="America/Toronto">
        캐나다 (토론토)
      </option>


      <option value="America/Vancouver">
        캐나다 (밴쿠버)
      </option>


      <option value="America/Mexico_City">
        멕시코 (멕시코시티)
      </option>


      <option value="America/Sao_Paulo">
        브라질 (상파울루)
      </option>


    </select>

  </div>


  <div class="clock-content">


    <div
      id="clockDisplay"
      class="display">

      00:00:00

    </div>


    <div
      id="dateDisplay"
      class="date">

      날짜

    </div>


  </div>


</section>



<!-- ==================================================
     타이머
================================================== -->

<section
  id="timer"
  class="screen">


  <button
    id="timerFullscreenButton"
    class="fullscreen-button"
    onclick="toggleFullscreen('timer')">

    ⛶ 전체화면

  </button>


  <h1 id="timerTitle">
    타이머
  </h1>


  <div
    id="timerDisplay"
    class="display">

    00:00:00

  </div>


  <div class="timer-inputs">


    <div class="timer-input-box">

      <label
        id="hoursLabel"
        for="timerHours">

        시간

      </label>


      <input
        type="number"
        id="timerHours"
        min="0"
        max="23"
        value="0">

    </div>


    <div class="colon">
      :
    </div>


    <div class="timer-input-box">

      <label
        id="minutesLabel"
        for="timerMinutes">

        분

      </label>


      <input
        type="number"
        id="timerMinutes"
        min="0"
        max="59"
        value="0">

    </div>


    <div class="colon">
      :
    </div>


    <div class="timer-input-box">

      <label
        id="secondsLabel"
        for="timerSeconds">

        초

      </label>


      <input
        type="number"
        id="timerSeconds"
        min="0"
        max="59"
        value="0">

    </div>


  </div>


  <div class="buttons">


    <button
      id="timerStartButton"
      class="start-button"
      onclick="toggleTimer()">

      시작

    </button>


    <button
      id="timerResetButton"
      class="reset-button"
      onclick="resetTimer()">

      초기화

    </button>


  </div>


</section>



<!-- ==================================================
     초시계
================================================== -->

<section
  id="stopwatch"
  class="screen">


  <button
    id="stopwatchFullscreenButton"
    class="fullscreen-button"
    onclick="toggleFullscreen('stopwatch')">

    ⛶ 전체화면

  </button>


  <h1 id="stopwatchTitle">
    초시계
  </h1>


  <div
    id="stopwatchDisplay"
    class="display">

    00:00:00

  </div>


  <div class="buttons">


    <button
      id="stopwatchStartButton"
      class="start-button"
      onclick="toggleStopwatch()">

      시작

    </button>


    <button
      id="stopwatchResetButton"
      class="reset-button"
      onclick="resetStopwatch()">

      초기화

    </button>


  </div>


</section>



<!-- ==================================================
     설정
================================================== -->

<section
  id="settings"
  class="screen settings-screen">


  <button
    id="settingsFullscreenButton"
    class="fullscreen-button"
    onclick="toggleFullscreen('settings')">

    ⛶ 전체화면

  </button>


  <h1
    id="settingsTitle"
    class="settings-title">

    설정

  </h1>


  <!-- 배경색 -->

  <div class="setting-section">


    <h2 id="backgroundTitle">
      배경색
    </h2>


    <p
      id="backgroundDescription"
      class="setting-description">

      파스텔톤 색상 중에서 원하는 배경색을 선택하세요.

    </p>


    <div class="pastel-colors">


      <button
        class="pastel-color pastel-pink"
        data-color="#ffd6e0"
        onclick="setBackgroundColor('#ffd6e0',this)">
      </button>


      <button
        class="pastel-color pastel-peach"
        data-color="#ffe0c2"
        onclick="setBackgroundColor('#ffe0c2',this)">
      </button>


      <button
        class="pastel-color pastel-yellow"
        data-color="#fff1b8"
        onclick="setBackgroundColor('#fff1b8',this)">
      </button>


      <button
        class="pastel-color pastel-green"
        data-color="#d8f3dc"
        onclick="setBackgroundColor('#d8f3dc',this)">
      </button>


      <button
        class="pastel-color pastel-mint"
        data-color="#c7f9e9"
        onclick="setBackgroundColor('#c7f9e9',this)">
      </button>


      <button
        class="pastel-color pastel-sky"
        data-color="#cfe8ff"
        onclick="setBackgroundColor('#cfe8ff',this)">
      </button>


      <button
        class="pastel-color pastel-blue"
        data-color="#d9dcff"
        onclick="setBackgroundColor('#d9dcff',this)">

function setBackgroundColor(
  color,
  selectedButton
) {

  document.documentElement.style.setProperty(
    "--bg-color",
    color
  );


  const buttonColor =
    buttonColors[color] ||
    "#7c83d9";


  document.documentElement.style.setProperty(
    "--button-bg",

  );


  document.documentElement.style.setProperty(
    "--active-bg",
    buttonColor
  );


  document
    .querySelectorAll(".pastel-color")
    .forEach(function(button) {

      button.classList.remove(
        "selected"

    });


  if (selectedButton) {

    selectedButton.classList.add(
      "selected"
    );

  }


  localStorage.setItem(
    "backgroundColor",
    color
  );

}

/* ==================================================
   현재시간
================================================== */

function updateClock() {

  const timezone =
    document
      .getElementById("timezone")
      .value;


  const now =
    new Date();


  let locale;


  switch (currentLanguage) {

    case "en":
      locale = "en-US";
      break;

    case "ja":
      locale = "ja-JP";
      break;

    case "zh":
      locale = "zh-CN";
      break;

    case "es":
      locale = "es-ES";
      break;

    case "fr":
      locale = "fr-FR";
      break;

    case "de":
      locale = "de-DE";
      break;

    case "it":
      locale = "it-IT";
      break;

    case "pt":
      locale = "pt-PT";
      break;

    case "ru":
      locale = "ru-RU";
      break;

    default:
      locale = "ko-KR";

  }


  const timeText =
    new Intl.DateTimeFormat(
      locale,
      {

        timeZone:
          timezone,

        hour:
          "2-digit",

        minute:
          "2-digit",

        second:
          "2-digit",

        hour12:
          currentLanguage === "en"

      }
    ).format(now);


  document
    .getElementById(
      "clockDisplay"
    )
    .textContent =
    timeText;


  const dateText =
    new Intl.DateTimeFormat(
      locale,
      {

        timeZone:
          timezone,

        year:
          "numeric",

        month:
          "long",

        day:
          "numeric",

        weekday:
          "long"

      }
    ).format(now);


  document
    .getElementById(
      "dateDisplay"
    )
    .textContent =
    dateText;

}


updateClock();


setInterval(
  updateClock,
  1000
);


/* ==================================================
   타이머
================================================== */

let timerTime = 0;

let timerInterval = null;

let timerRunning = false;


/* ==================================================
   타이머 표시
================================================== */

function updateTimer() {

  const hours =
    Math.floor(
      timerTime / 3600
    );


  const minutes =
    Math.floor(
      (timerTime % 3600) / 60
    );


  const seconds =
    timerTime % 60;


  document
    .getElementById(
      "timerDisplay"
    )
    .textContent =

    String(hours)
      .padStart(2,"0")

    + ":" +

    String(minutes)
      .padStart(2,"0")

    + ":" +

    String(seconds)
      .padStart(2,"0");

}


updateTimer();


/* ==================================================
   타이머 시작 / 정지
================================================== */

function toggleTimer() {

  const button =
    document
      .getElementById(
        "timerStartButton"
      );


  const t =
    translations[
      currentLanguage
    ];


  if (timerRunning) {

    clearInterval(
      timerInterval
    );


    timerInterval = null;

    timerRunning = false;


    button.textContent =
      t.start;


    return;
  }


  if (timerTime === 0) {

    const hours =
      Number(
        document
          .getElementById(
            "timerHours"
          )
          .value
      );


    const minutes =
      Number(
        document
          .getElementById(
            "timerMinutes"
          )
          .value
      );


    const seconds =
      Number(
        document
          .getElementById(
            "timerSeconds"
          )
          .value
      );


    if (

      hours < 0 ||
      hours > 23 ||

      minutes < 0 ||
      minutes > 59 ||

      seconds < 0 ||
      seconds > 59

    ) {

      alert(
        t.timerRangeAlert
      );


      return;
    }


    if (

      hours === 0 &&
      minutes === 0 &&
      seconds === 0

    ) {

      alert(
        t.timerAlert
      );


      return;
    }


    timerTime =

      hours * 3600 +

      minutes * 60 +

      seconds;


    updateTimer();

  }


  timerRunning = true;


  button.textContent =
    t.stop;


  timerInterval =
    setInterval(function() {

      timerTime--;

      updateTimer();


      if (
        timerTime <= 0
      ) {

        clearInterval(
          timerInterval
        );


        timerInterval = null;

        timerRunning = false;

        timerTime = 0;


        button.textContent =
          translations[
            currentLanguage
          ].start;


        updateTimer();


        alert(
          translations[
            currentLanguage
          ].timerFinished
        );

      }

    },1000);

}


/* ==================================================
   타이머 초기화
================================================== */

function resetTimer() {

  clearInterval(
    timerInterval
  );


  timerInterval = null;

  timerRunning = false;

  timerTime = 0;


  document
    .getElementById(
      "timerHours"

    .value = 0;


  document
    .getElementById(
      "timerMinutes"

  document

  updateTimer();

}


/* ==================================================
   초시계
================================================== */

let stopwatchRunning =
  false;

let stopwatchStartTime =
  0;

let stopwatchElapsed =
  0;

let stopwatchAnimation =
  null;


/* ==================================================
   초시계 표시
================================================== */

function updateStopwatch() {

  let totalMilliseconds;


  if (
    stopwatchRunning
  ) {

    totalMilliseconds =

      stopwatchElapsed +

      (
        performance.now() -
        stopwatchStartTime
      );

  }

  else {

    totalMilliseconds =
      stopwatchElapsed;

  }


  const oneHour =
    60 * 60 * 1000;


  let displayText;


  /*
     1시간 미만:
     분 : 초 : 밀리초
  */

  if (
    totalMilliseconds <
    oneHour
  ) {

    const minutes =
      Math.floor(
        totalMilliseconds /
        60000
      );


    const seconds =
      Math.floor(
        (
          totalMilliseconds %
          60000
        ) / 1000
      );


    const milliseconds =
      Math.floor(
        (
          totalMilliseconds %
          1000
        ) / 10
      );


    displayText =

      String(minutes)
        .padStart(2,"0")

      + ":" +

      String(seconds)
        .padStart(2,"0")

      + ":" +

      String(milliseconds)
        .padStart(2,"0");

  }

  /*
     1시간 이상:
     시간 : 분 : 초
  */

  else {

    const hours =
      Math.floor(
        totalMilliseconds /
        3600000
      );


    const minutes =
      Math.floor(
        (
          totalMilliseconds %
          3600000
        ) / 60000
      );


    const seconds =
      Math.floor(
        (
          totalMilliseconds %
          60000
        ) / 1000
      );


    displayText =

      String(hours)
        .padStart(2,"0")

      + ":" +

      String(minutes)
        .padStart(2,"0")

      + ":" +

      String(seconds)
        .padStart(2,"0");

  }


  document
    .getElementById(
      "stopwatchDisplay"
    )
    .textContent =
    displayText;


  if (
    stopwatchRunning
  ) {

    stopwatchAnimation =
      requestAnimationFrame(
        updateStopwatch
      );

  }

}


/* ==================================================
   초시계 시작 / 정지
================================================== */

function toggleStopwatch() {

  const button =
    document
      .getElementById(
        "stopwatchStartButton"
      );


  const t =
    translations[
      currentLanguage
    ];


  if (
    stopwatchRunning
  ) {

    stopwatchElapsed +=

      performance.now() -
      stopwatchStartTime;


    stopwatchRunning =
      false;


    stopwatchStartTime =
      0;


    if (
      stopwatchAnimation !== null
    ) {

      cancelAnimationFrame(
        stopwatchAnimation
      );


      stopwatchAnimation =
        null;

    }


    button.textContent =
      t.start;


    updateStopwatch();


    return;
  }


  stopwatchRunning =
    true;


  stopwatchStartTime =
    performance.now();


  button.textContent =
    t.stop;


  updateStopwatch();

}


/* ==================================================
   초시계 초기화
================================================== */

function resetStopwatch() {

  if (
    stopwatchAnimation !== null
  ) {

    cancelAnimationFrame(
      stopwatchAnimation
    );


    stopwatchAnimation =
      null;

  }


  stopwatchRunning =
    false;


  stopwatchStartTime =
    0;


  stopwatchElapsed =
    0;


  document
    .getElementById(
      "stopwatchStartButton"
    )
    .textContent =
    translations[
      currentLanguage
    ].start;


  document
    .getElementById(
      "stopwatchDisplay"
    )
    .textContent =
    "00:00:00";

}

  screenId

    document.getElementById(

        .catch(function(error) {

          console.log(
            "전체화면 오류:",
            error
          );

        });

    }

  }

  else {

    if (
      document.exitFullscreen
    ) {

      document.exitFullscreen();

    }

  }

}

function updateFullscreenButtons() {

    translations[

    document.querySelectorAll(

  buttons.forEach(
    function(button) {

      if (
        document.fullscreenElement
      ) {

        button.textContent =
          t.exitFullscreen;

      }

      else {

        button.textContent =
          t.fullscreen;

      }

    }
  );

}


/* ==================================================
   언어 변경
================================================== */

function changeLanguage() {

  currentLanguage =
    document
      .getElementById(
        "languageSelect"
      )
      .value;


  localStorage.setItem(
    "language",
    currentLanguage
  );


  applyLanguage();

}


/* ==================================================
   언어 적용
================================================== */

function applyLanguage() {

  const t =
    translations[
      currentLanguage
    ];


  document.documentElement.lang =
    currentLanguage;


  document
    .getElementById("logo")
    .textContent =
    t.title;


  document
    .getElementById("clockButton")
    .textContent =
    t.clock;


  document
    .getElementById("timerButton")
    .textContent =
    t.timer;


  document
    .getElementById("stopwatchButton")
    .textContent =
    t.stopwatch;


  document
    .getElementById("settingsButton")
    .textContent =
    t.settings;


  document
    .getElementById("clockTitle")
    .textContent =
    t.clock;


  document
    .getElementById("timezoneLabel")
    .textContent =
    t.timezone;


  document
    .getElementById("timerTitle")
    .textContent =
    t.timer;


  document
    .getElementById("hoursLabel")
    .textContent =
    t.hours;


  document
    .getElementById("minutesLabel")
    .textContent =
    t.minutes;


  document
    .getElementById("secondsLabel")
    .textContent =
    t.seconds;


  document
    .getElementById("timerResetButton")
    .textContent =
    t.reset;


  document
    .getElementById("timerStartButton")
    .textContent =

    timerRunning
      ? t.stop
      : t.start;


  document
    .getElementById("stopwatchTitle")
    .textContent =
    t.stopwatch;


  document
    .getElementById("stopwatchResetButton")
    .textContent =
    t.reset;


  document
    .getElementById(
      "stopwatchStartButton"
    )
    .textContent =

    stopwatchRunning
      ? t.stop
      : t.start;


  document
    .getElementById("settingsTitle")
    .textContent =
    t.settings;


  document
    .getElementById("backgroundTitle")
    .textContent =
    t.background;


  document
    .getElementById(
      "backgroundDescription"
    )
    .textContent =
    t.backgroundDescription;


  document
    .getElementById(
      "defaultBackgroundButton"
    )
    .textContent =
    t.defaultBackground;


  document
    .getElementById("languageTitle")
    .textContent =
    t.language;


  document
    .getElementById(
      "languageDescription"
    )
    .textContent =
    t.languageDescription;


  updateFullscreenButtons();


  updateClock();

}


/* ==================================================
   초기 설정
================================================== */

document
  .getElementById("languageSelect")
  .value =
  currentLanguage;


applyLanguage();


</script>
