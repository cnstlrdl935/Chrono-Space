<!DOCTYPE html>
<html lang="ko">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>시간 도구</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {

      margin: 0;

      font-family:
        Arial,
        "Noto Sans KR",
        sans-serif;

      background: #eef2ff;

      color: #1e293b;

      min-height: 100vh;

      transition:
        background 0.25s ease;

    }


    /* =================================
       전체 레이아웃
    ================================= */

    .layout {

      display: flex;

      min-height: 100vh;

    }


    /* =================================
       왼쪽 메뉴
    ================================= */

    .sidebar {

      width: 210px;

      background: #ffffff;

      padding: 25px 15px;

      box-shadow:
        3px 0 15px
        rgba(30, 41, 59, 0.08);

      display: flex;

      flex-direction: column;

      gap: 10px;

    }


    .logo {

      font-size: 22px;

      font-weight: bold;

      text-align: center;

      color: #4f46e5;

      margin-bottom: 20px;

    }


    /* =================================
       메뉴 버튼
    ================================= */

    .menu-button {

      width: 100%;

      border: none;

      background: #e2e8f0;

      color: #475569;

      padding: 14px 15px;

      border-radius: 12px;

      font-size: 16px;

      font-weight: 600;

      cursor: pointer;

      text-align: left;

      transition: 0.2s;

    }


    .menu-button:hover {

      background: #cbd5e1;

    }


    .menu-button.active {

      background: #4f46e5;

      color: white;

      box-shadow:
        0 4px 10px
        rgba(79, 70, 229, 0.25);

    }


    /* =================================
       설정 메뉴
    ================================= */

    .settings-button {

      margin-top: 0;

    }


    /* =================================
       메인 영역
    ================================= */

    .main {

      flex: 1;

      display: flex;

      justify-content: center;

      align-items: center;

      padding: 35px;

      min-width: 0;

    }


    /* =================================
       화면
    ================================= */

    .screen {

      display: none;

      position: relative;

      background: white;

      width: 100%;

      max-width: 760px;

      min-height: 450px;

      padding: 55px 35px;

      border-radius: 24px;

      text-align: center;

      box-shadow:
        0 15px 40px
        rgba(30, 41, 59, 0.10);

    }


    .screen.active {

      display: block;

    }


    h1 {

      margin-top: 20px;

      margin-bottom: 10px;

      font-size: 30px;

      color: #1e293b;

    }


    /* =================================
       날짜
    ================================= */

    .date {

      position: absolute;

      top: 25px;

      left: 30px;

      font-size: 15px;

      color: #64748b;

      font-weight: 500;

      text-align: left;

    }


    /* =================================
       시간대
    ================================= */

    .timezone-box {

      margin-top: 20px;

      margin-bottom: 20px;

    }


    .timezone-box label {

      display: block;

      margin-bottom: 8px;

      color: #64748b;

      font-size: 14px;

    }


    .timezone-box select {

      padding: 11px 15px;

      border: 1px solid #cbd5e1;

      border-radius: 10px;

      background: white;

      color: #334155;

      font-size: 15px;

      cursor: pointer;

      outline: none;

    }


    .timezone-box select:focus {

      border-color: #6366f1;

    }


    /* =================================
       숫자 표시
    ================================= */

    .display {

      font-family: monospace;

      font-size: 62px;

      font-weight: bold;

      color: #312e81;

      margin: 40px 0;

      white-space: nowrap;

    }


    /* =================================
       타이머 입력
    ================================= */

    .timer-inputs {

      display: flex;

      justify-content: center;

      align-items: center;

      gap: 12px;

      margin-bottom: 30px;

    }


    .timer-input-box {

      display: flex;

      flex-direction: column;

      align-items: center;

    }


    .timer-input-box label {

      font-size: 14px;

      margin-bottom: 7px;

      color: #64748b;

    }


    .timer-input-box input {

      width: 100px;

      padding: 14px 8px;

      font-size: 22px;

      text-align: center;

      border: 1px solid #cbd5e1;

      border-radius: 10px;

      outline: none;

      color: #1e293b;

    }


    .timer-input-box input:focus {

      border-color: #6366f1;

      box-shadow:
        0 0 0 3px
        rgba(99, 102, 241, 0.12);

    }


    .colon {

      font-size: 30px;

      font-weight: bold;

      margin-top: 23px;

      color: #64748b;

    }


    /* =================================
       버튼
    ================================= */

    .buttons {

      display: flex;

      justify-content: center;

      gap: 8px;

      flex-wrap: wrap;

    }


    .buttons button {

      border: none;

      padding: 12px 25px;

      border-radius: 11px;

      font-size: 16px;

      font-weight: 600;

      cursor: pointer;

      transition: 0.2s;

    }


    .start-button {

      background: #4f46e5;

      color: white;

    }


    .start-button:hover {

      background: #4338ca;

    }


    .reset-button {

      background: #e2e8f0;

      color: #475569;

    }


    .reset-button:hover {

      background: #cbd5e1;

    }


    /* =================================
       설정 화면
    ================================= */

    .settings-screen {

      text-align: left;

    }


    .settings-title {

      text-align: center;

      margin-bottom: 35px;

    }


    .setting-section {

      background: #f8fafc;

      border-radius: 16px;

      padding: 25px;

      margin-bottom: 20px;

    }


    .setting-section h2 {

      margin: 0 0 8px 0;

      font-size: 20px;

      color: #334155;

    }


    .setting-description {

      margin: 0 0 20px 0;

      font-size: 14px;

      color: #64748b;

    }


    /* =================================
       파스텔 색상 팔레트
    ================================= */

    .pastel-colors {

      display: grid;

      grid-template-columns:
        repeat(5, 1fr);

      gap: 12px;

    }


    .pastel-color {

      width: 100%;

      aspect-ratio: 1 / 1;

      border-radius: 14px;

      border: 3px solid transparent;

      cursor: pointer;

      transition:
        transform 0.15s,
        border-color 0.15s;

      box-shadow:
        0 3px 8px
        rgba(0, 0, 0, 0.08);

    }


    .pastel-color:hover {

      transform: scale(1.06);

    }


    .pastel-color.selected {

      border-color: #334155;

      box-shadow:
        0 0 0 2px white,
        0 0 0 4px #334155;

    }


    /* 파스텔 색상 */

    .pastel-pink {
      background: #ffd6e0;
    }

    .pastel-peach {
      background: #ffe0c2;
    }

    .pastel-yellow {
      background: #fff1b8;
    }

    .pastel-green {
      background: #d8f3dc;
    }

    .pastel-mint {
      background: #c7f9e9;
    }

    .pastel-sky {
      background: #cfe8ff;
    }

    .pastel-blue {
      background: #d9dcff;
    }

    .pastel-purple {
      background: #eadcff;
    }

    .pastel-lavender {
      background: #f0ddff;
    }

    .pastel-cream {
      background: #fff7df;
    }


    /* =================================
       기본색 버튼
    ================================= */

    .default-background-button {

      margin-top: 20px;

      border: none;

      background: #e2e8f0;

      color: #475569;

      padding: 11px 18px;

      border-radius: 10px;

      font-size: 14px;

      cursor: pointer;

    }


    .default-background-button:hover {

      background: #cbd5e1;

    }


    /* =================================
       모바일
    ================================= */

    @media (max-width: 700px) {


      .layout {

        flex-direction: column;

      }


      .sidebar {

        width: 100%;

        padding: 12px;

        flex-direction: row;

        flex-wrap: wrap;

        align-items: center;

        gap: 6px;

      }


      .logo {

        width: 100%;

        margin-bottom: 5px;

      }


      .menu-button {

        width: auto;

        flex: 1;

        text-align: center;

        padding: 10px 8px;

        font-size: 14px;

      }


      .settings-button {

        flex: 1;

      }


      .main {

        padding: 15px;

      }


      .screen {

        min-height: 420px;

        padding: 55px 15px 40px;

      }


      .date {

        top: 20px;

        left: 20px;

        font-size: 13px;

      }


      .display {

        font-size: 42px;

        margin: 35px 0;

      }


      .timer-inputs {

        gap: 5px;

      }


      .timer-input-box input {

        width: 80px;

        font-size: 20px;

      }


      .colon {

        font-size: 22px;

      }


      .pastel-colors {

        grid-template-columns:
          repeat(5, 1fr);

        gap: 8px;

      }


    }


    @media (max-width: 400px) {


      .timer-input-box input {

        width: 65px;

      }


      .timer-inputs {

        gap: 2px;

      }


      .display {

        font-size: 34px;

      }


      .pastel-colors {

        gap: 6px;

      }

    }

  </style>

</head>


<body>


  <div class="layout">


    <!-- =================================
         왼쪽 메뉴
    ================================== -->

    <aside class="sidebar">


      <div class="logo">

        시간 도구

      </div>


      <!-- 현재시간 -->

      <button
        id="clockButton"
        class="menu-button active"
        onclick="showScreen('clock')">

        현재시간

      </button>


      <!-- 타이머 -->

      <button
        id="timerButton"
        class="menu-button"
        onclick="showScreen('timer')">

        타이머

      </button>


      <!-- 초시계 -->

      <button
        id="stopwatchButton"
        class="menu-button"
        onclick="showScreen('stopwatch')">

        초시계

      </button>


      <!-- 설정 -->

      <button
        id="settingsButton"
        class="menu-button settings-button"
        onclick="showScreen('settings')">

        설정

      </button>


    </aside>



    <!-- =================================
         메인 영역
    ================================== -->

    <main class="main">


      <!-- =================================
           현재시간
      ================================== -->

      <div
        id="clock"
        class="screen active">


        <!-- 날짜 -->

        <div
          id="dateDisplay"
          class="date">

          날짜

        </div>


        <h1>현재시간</h1>


        <!-- 시간대 -->

        <div class="timezone-box">


          <label for="timezone">

            시간대

          </label>


          <select
            id="timezone"
            onchange="updateClock()">


            <option value="Asia/Seoul">
              대한민국 (서울)
            </option>


            <option value="Asia/Tokyo">
              일본 (도쿄)
            </option>


            <option value="America/New_York">
              미국 (뉴욕)
            </option>


            <option value="America/Los_Angeles">
              미국 (로스앤젤레스)
            </option>


            <option value="Europe/London">
              영국 (런던)
            </option>


            <option value="Europe/Paris">
              프랑스 (파리)
            </option>


            <option value="Asia/Shanghai">
              중국 (상하이)
            </option>


            <option value="Australia/Sydney">
              호주 (시드니)
            </option>


          </select>


        </div>


        <!-- 현재 시간 -->

        <div
          id="clockDisplay"
          class="display">

          00:00:00

        </div>


      </div>



      <!-- =================================
           타이머
      ================================== -->

      <div
        id="timer"
        class="screen">


        <h1>타이머</h1>


        <div
          id="timerDisplay"
          class="display">

          00:00:00

        </div>


        <!-- 시간 / 분 / 초 -->

        <div class="timer-inputs">


          <div class="timer-input-box">

            <label for="timerHours">
              시간
            </label>

            <input
              type="number"
              id="timerHours"
              min="0"
              max="23"
              value="0">

          </div>


          <div class="colon">
            :
          </div>


          <div class="timer-input-box">

            <label for="timerMinutes">
              분
            </label>

            <input
              type="number"
              id="timerMinutes"
              min="0"
              max="59"
              value="0">

          </div>


          <div class="colon">
            :
          </div>


          <div class="timer-input-box">

            <label for="timerSeconds">
              초
            </label>

            <input
              type="number"
              id="timerSeconds"
              min="0"
              max="59"
              value="0">

          </div>


        </div>


        <div class="buttons">


          <button
            id="timerStartButton"
            class="start-button"
            onclick="toggleTimer()">

            시작

          </button>


          <button
            class="reset-button"
            onclick="resetTimer()">

            초기화

          </button>


        </div>


      </div>



      <!-- =================================
           초시계
      ================================== -->

      <div
        id="stopwatch"
        class="screen">


        <h1>초시계</h1>


        <div
          id="stopwatchDisplay"
          class="display">

          00:00:00

        </div>


        <div class="buttons">


          <button
            id="stopwatchStartButton"
            class="start-button"
            onclick="toggleStopwatch()">

            시작

          </button>


          <button
            class="reset-button"
            onclick="resetStopwatch()">

            초기화

          </button>


        </div>


      </div>



      <!-- =================================
           설정
      ================================== -->

      <div
        id="settings"
        class="screen settings-screen">


        <h1 class="settings-title">
          설정
        </h1>


        <div class="setting-section">


          <h2>
            배경색
          </h2>


          <p class="setting-description">

            파스텔톤 색상 중에서 원하는 배경색을 선택하세요.

          </p>


          <!-- 파스텔 색상 -->

          <div class="pastel-colors">


            <button
              class="pastel-color pastel-pink"
              data-color="#ffd6e0"
              onclick="setBackgroundColor('#ffd6e0', this)"
              aria-label="파스텔 핑크">
            </button>


            <button
              class="pastel-color pastel-peach"
              data-color="#ffe0c2"
              onclick="setBackgroundColor('#ffe0c2', this)"
              aria-label="파스텔 피치">
            </button>


            <button
              class="pastel-color pastel-yellow"
              data-color="#fff1b8"
              onclick="setBackgroundColor('#fff1b8', this)"
              aria-label="파스텔 노랑">
            </button>


            <button
              class="pastel-color pastel-green"
              data-color="#d8f3dc"
              onclick="setBackgroundColor('#d8f3dc', this)"
              aria-label="파스텔 그린">
            </button>


            <button
              class="pastel-color pastel-mint"
              data-color="#c7f9e9"
              onclick="setBackgroundColor('#c7f9e9', this)"
              aria-label="파스텔 민트">
            </button>


            <button
              class="pastel-color pastel-sky"
              data-color="#cfe8ff"
              onclick="setBackgroundColor('#cfe8ff', this)"
              aria-label="파스텔 하늘색">
            </button>


            <button
              class="pastel-color pastel-blue"
              data-color="#d9dcff"
              onclick="setBackgroundColor('#d9dcff', this)"
              aria-label="파스텔 블루">
            </button>


            <button
              class="pastel-color pastel-purple"
              data-color="#eadcff"
              onclick="setBackgroundColor('#eadcff', this)"
              aria-label="파스텔 보라">
            </button>


            <button
              class="pastel-color pastel-lavender"
              data-color="#f0ddff"
              onclick="setBackgroundColor('#f0ddff', this)"
              aria-label="파스텔 라벤더">
            </button>


            <button
              class="pastel-color pastel-cream"
              data-color="#fff7df"
              onclick="setBackgroundColor('#fff7df', this)"
              aria-label="파스텔 크림">
            </button>


          </div>


          <!-- 기본색 -->

          <button
            class="default-background-button"
            onclick="resetBackgroundColor()">

            기본색으로 초기화

          </button>


        </div>


      </div>


    </main>


  </div>



  <script>


    /* =====================================
       화면 전환
    ===================================== */

    function showScreen(screenName) {


      // 모든 화면 숨기기

      document
        .querySelectorAll(".screen")
        .forEach(function(screen) {

          screen.classList.remove("active");

        });


      // 모든 메뉴 버튼 비활성화

      document
        .querySelectorAll(".menu-button")
        .forEach(function(button) {

          button.classList.remove("active");

        });


      // 선택한 화면 표시

      document
        .getElementById(screenName)
        .classList.add("active");


      // 선택한 메뉴 활성화

      document
        .getElementById(screenName + "Button")
        .classList.add("active");

    }



    /* =====================================
       배경색
    ===================================== */

    const defaultBackgroundColor =
      "#eef2ff";


    function setBackgroundColor(
      color,
      selectedButton
    ) {


      // 배경 변경

      document.body.style.background =
        color;


      // 저장

      localStorage.setItem(
        "backgroundColor",
        color
      );


      // 기존 선택 제거

      document
        .querySelectorAll(
          ".pastel-color"
        )
        .forEach(function(button) {

          button.classList.remove(
            "selected"
          );

        });


      // 현재 선택 표시

      if (selectedButton) {

        selectedButton.classList.add(
          "selected"
        );

      }

    }



    /* =====================================
       기본 배경색
    ===================================== */

    function resetBackgroundColor() {


      document.body.style.background =
        defaultBackgroundColor;


      localStorage.setItem(
        "backgroundColor",
        defaultBackgroundColor
      );


      document
        .querySelectorAll(
          ".pastel-color"
        )
        .forEach(function(button) {

          button.classList.remove(
            "selected"
          );

        });

    }



    /* =====================================
       저장된 배경색 불러오기
    ===================================== */

    const savedColor =
      localStorage.getItem(
        "backgroundColor"
      );


    if (savedColor) {


      document.body.style.background =
        savedColor;


      const matchingButton =
        document.querySelector(
          '.pastel-color[data-color="' +
          savedColor +
          '"]'
        );


      if (matchingButton) {

        matchingButton.classList.add(
          "selected"
        );

      }

    }

    else {


      const defaultButton =
        document.querySelector(
          '.pastel-color[data-color="' +
          defaultBackgroundColor +
          '"]'
        );


      if (defaultButton) {

        defaultButton.classList.add(
          "selected"
        );

      }

    }



    /* =====================================
       현재시간
    ===================================== */

    function updateClock() {


      const timezone =
        document
          .getElementById(
            "timezone"
          )
          .value;


      const now = new Date();


      // 시간

      const timeText =
        new Intl.DateTimeFormat(
          "ko-KR",
          {

            timeZone: timezone,

            hour: "2-digit",

            minute: "2-digit",

            second: "2-digit",

            hour12: false

          }
        ).format(now);


      document
        .getElementById(
          "clockDisplay"
        )
        .textContent =
        timeText;



      // 날짜

      const dateText =
        new Intl.DateTimeFormat(
          "ko-KR",
          {

            timeZone: timezone,

            year: "numeric",

            month: "long",

            day: "numeric",

            weekday: "long"

          }
        ).format(now);


      document
        .getElementById(
          "dateDisplay"
        )
        .textContent =
        dateText;

    }


    updateClock();


    setInterval(
      updateClock,
      1000
    );



    /* =====================================
       타이머
    ===================================== */

    let timerTime = 0;

    let timerInterval = null;

    let timerRunning = false;



    function updateTimer() {


      const hours =
        Math.floor(
          timerTime / 3600
        );


      const minutes =
        Math.floor(
          (timerTime % 3600) / 60
        );


      const seconds =
        timerTime % 60;


      document
        .getElementById(
          "timerDisplay"
        )
        .textContent =

        String(hours)
          .padStart(2, "0") +

        ":" +

        String(minutes)
          .padStart(2, "0") +

        ":" +

        String(seconds)
          .padStart(2, "0");

    }


    updateTimer();



    /* =====================================
       타이머 시작 / 정지
    ===================================== */

    function toggleTimer() {


      const button =
        document
          .getElementById(
            "timerStartButton"
          );


      // 실행 중이면 정지

      if (timerRunning) {


        clearInterval(
          timerInterval
        );


        timerInterval = null;

        timerRunning = false;


        button.textContent =
          "시작";


        return;

      }


      // 처음 시작

      if (timerTime === 0) {


        const hours =
          Number(
            document
              .getElementById(
                "timerHours"
              )
              .value
          );


        const minutes =
          Number(
            document
              .getElementById(
                "timerMinutes"
              )
              .value
          );


        const seconds =
          Number(
            document
              .getElementById(
                "timerSeconds"
              )
              .value
          );


        // 범위 검사

        if (
          hours < 0 ||
          hours > 23 ||
          minutes < 0 ||
          minutes > 59 ||
          seconds < 0 ||
          seconds > 59
        ) {


          alert(
            "시간은 0~23, 분과 초는 0~59 사이로 입력해주세요."
          );


          return;

        }


        // 0이면 실행하지 않음

        if (
          hours === 0 &&
          minutes === 0 &&
          seconds === 0
        ) {


          alert(
            "타이머 시간을 설정해주세요."
          );


          return;

        }


        timerTime =

          hours * 3600 +

          minutes * 60 +

          seconds;


        updateTimer();

      }


      timerRunning = true;


      button.textContent =
        "정지";


      timerInterval =
        setInterval(function() {


          timerTime--;


          updateTimer();


          // 타이머 종료

          if (timerTime <= 0) {


            clearInterval(
              timerInterval
            );


            timerInterval = null;


            timerRunning = false;


            timerTime = 0;


            button.textContent =
              "시작";


            updateTimer();


            alert(
              "타이머가 끝났습니다!"
            );

          }


        }, 1000);

    }



    /* =====================================
       타이머 초기화
    ===================================== */

    function resetTimer() {


      clearInterval(
        timerInterval
      );


      timerInterval = null;


      timerRunning = false;


      timerTime = 0;


      document
        .getElementById(
          "timerStartButton"
        )
        .textContent =
        "시작";


      document
        .getElementById(
          "timerHours"
        )
        .value = 0;


      document
        .getElementById(
          "timerMinutes"
        )
        .value = 0;


      document
        .getElementById(
          "timerSeconds"
        )
        .value = 0;


      updateTimer();

    }



    /* =====================================
       초시계
    ===================================== */

    let stopwatchRunning = false;

    let stopwatchStartTime = 0;

    let stopwatchElapsed = 0;

    let stopwatchAnimation = null;



    function updateStopwatch() {


      let totalMilliseconds;


      if (stopwatchRunning) {


        totalMilliseconds =

          stopwatchElapsed +

          (
            performance.now() -
            stopwatchStartTime
          );

      }

      else {


        totalMilliseconds =
          stopwatchElapsed;

      }


      const oneHour =
        60 * 60 * 1000;


      let displayText;



      // 1시간 미만

      if (
        totalMilliseconds < oneHour
      ) {


        const minutes =
          Math.floor(
            totalMilliseconds / 60000
          );


        const seconds =
          Math.floor(
            (totalMilliseconds % 60000)
            / 1000
          );


        const milliseconds =
          Math.floor(
            (totalMilliseconds % 1000)
            / 10
          );


        displayText =

          String(minutes)
            .padStart(2, "0") +

          ":" +

          String(seconds)
            .padStart(2, "0") +

          ":" +

          String(milliseconds)
            .padStart(2, "0");

      }


      // 1시간 이상

      else {


        const hours =
          Math.floor(
            totalMilliseconds / 3600000
          );


        const minutes =
          Math.floor(
            (totalMilliseconds % 3600000)
            / 60000
          );


        const seconds =
          Math.floor(
            (totalMilliseconds % 60000)
            / 1000
          );


        displayText =

          String(hours)
            .padStart(2, "0") +

          ":" +

          String(minutes)
            .padStart(2, "0") +

          ":" +

          String(seconds)
            .padStart(2, "0");

      }


      document
        .getElementById(
          "stopwatchDisplay"
        )
        .textContent =
        displayText;


      // 계속 실행

      if (stopwatchRunning) {


        stopwatchAnimation =
          requestAnimationFrame(
            updateStopwatch
          );

      }

    }



    /* =====================================
       초시계 시작 / 정지
    ===================================== */

    function toggleStopwatch() {


      const button =
        document
          .getElementById(
            "stopwatchStartButton"
          );


      // 실행 중이면 정지

      if (stopwatchRunning) {


        stopwatchElapsed +=

          performance.now() -
          stopwatchStartTime;


        stopwatchRunning = false;


        stopwatchStartTime = 0;


        if (
          stopwatchAnimation !== null
        ) {


          cancelAnimationFrame(
            stopwatchAnimation
          );


          stopwatchAnimation = null;

        }


        button.textContent =
          "시작";


        updateStopwatch();


        return;

      }


      // 시작

      stopwatchRunning = true;


      stopwatchStartTime =
        performance.now();


      button.textContent =
        "정지";


      updateStopwatch();

    }



    /* =====================================
       초시계 초기화
    ===================================== */

    function resetStopwatch() {


      if (
        stopwatchAnimation !== null
      ) {


        cancelAnimationFrame(
          stopwatchAnimation
        );


        stopwatchAnimation = null;

      }


      stopwatchRunning = false;


      stopwatchStartTime = 0;


      stopwatchElapsed = 0;


      document
        .getElementById(
          "stopwatchStartButton"
        )
        .textContent =
        "시작";


      document
        .getElementById(
          "stopwatchDisplay"
        )
        .textContent =
        "00:00:00";

    }

  </script>

</body>
