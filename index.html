<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>시간 도구</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f4f7;
      text-align: center;
    }

    h1 {
      margin: 50px 0 30px;
    }

    .container {
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    .card {
      background: white;
      width: 250px;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }

    .display {
      font-size: 36px;
      font-weight: bold;
      margin: 25px 0;
      font-family: monospace;
    }

    input {
      width: 80%;
      padding: 10px;
      font-size: 16px;
      margin-bottom: 10px;
    }

    button {
      padding: 10px 14px;
      margin: 3px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.7;
    }
  </style>
</head>

<body>

  <h1>시간 도구</h1>

  <div class="container">

    <!-- 현재시간 -->
    <div class="card">
      <h2>현재시간</h2>

      <div id="clock" class="display">
        00:00:00
      </div>
    </div>


    <!-- 타이머 -->
    <div class="card">
      <h2>타이머</h2>

      <div id="timer" class="display">
        00:00
      </div>

      <input
        type="number"
        id="timerInput"
        placeholder="초 입력"
        min="1"
      >

      <br>

      <button onclick="startTimer()">시작</button>
      <button onclick="pauseTimer()">정지</button>
      <button onclick="resetTimer()">초기화</button>
    </div>


    <!-- 초시계 -->
    <div class="card">
      <h2>초시계</h2>

      <div id="stopwatch" class="display">
        00:00:00
      </div>

      <button onclick="startStopwatch()">시작</button>
      <button onclick="pauseStopwatch()">정지</button>
      <button onclick="resetStopwatch()">초기화</button>
    </div>

  </div>


  <script>

    // =========================
    // 현재시간
    // =========================

    function updateClock() {

      const now = new Date();

      const h = String(now.getHours()).padStart(2, "0");
      const m = String(now.getMinutes()).padStart(2, "0");
      const s = String(now.getSeconds()).padStart(2, "0");

      document.getElementById("clock").textContent =
        h + ":" + m + ":" + s;
    }

    updateClock();

    setInterval(updateClock, 1000);


    // =========================
    // 타이머
    // =========================

    let timerTime = 0;
    let timerInterval = null;


    function updateTimer() {

      const minutes = Math.floor(timerTime / 60);
      const seconds = timerTime % 60;

      document.getElementById("timer").textContent =
        String(minutes).padStart(2, "0") +
        ":" +
        String(seconds).padStart(2, "0");
    }


    function startTimer() {

      if (timerInterval !== null) {
        return;
      }

      if (timerTime === 0) {

        const input =
          document.getElementById("timerInput");

        timerTime = Number(input.value);

        if (timerTime <= 0) {
          alert("초를 입력해주세요.");
          return;
        }
      }

      timerInterval = setInterval(function() {

        timerTime--;

        updateTimer();

        if (timerTime <= 0) {

          clearInterval(timerInterval);

          timerInterval = null;

          alert("타이머가 끝났습니다!");

        }

      }, 1000);
    }


    function pauseTimer() {

      clearInterval(timerInterval);

      timerInterval = null;
    }


    function resetTimer() {

      clearInterval(timerInterval);

      timerInterval = null;

      timerTime = 0;

      document.getElementById("timerInput").value = "";

      updateTimer();
    }


    // =========================
    // 초시계
    // =========================

    let stopwatchTime = 0;
    let stopwatchInterval = null;


    function updateStopwatch() {

      const hours =
        Math.floor(stopwatchTime / 3600);

      const minutes =
        Math.floor((stopwatchTime % 3600) / 60);

      const seconds =
        stopwatchTime % 60;


      document.getElementById("stopwatch").textContent =

        String(hours).padStart(2, "0") +
        ":" +

        String(minutes).padStart(2, "0") +
        ":" +

        String(seconds).padStart(2, "0");
    }


    function startStopwatch() {

      if (stopwatchInterval !== null) {
        return;
      }

      stopwatchInterval = setInterval(function() {

        stopwatchTime++;

        updateStopwatch();

      }, 1000);
    }


    function pauseStopwatch() {

      clearInterval(stopwatchInterval);

      stopwatchInterval = null;
    }


    function resetStopwatch() {

      clearInterval(stopwatchInterval);

      stopwatchInterval = null;

      stopwatchTime = 0;

      updateStopwatch();
    }

  </script>

</body>
</html>
</html>
