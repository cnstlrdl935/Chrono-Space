  font-family: "choon.clock", sans-serif;

  background: var(--bg-color);
  color: var(--text-color);

  overflow-x: hidden;

  transition:
    background 0.3s ease,
    color 0.3s ease;
}

button,
input,
select {
  font-family: inherit;
}


/* =========================================
   전체 레이아웃
========================================= */

.layout {
  display: flex;

  width: 100%;
  min-height: 100vh;
}


/* =========================================
   왼쪽 메뉴
========================================= */

.sidebar {
  width: 210px;
  min-height: 100vh;

  flex-shrink: 0;

  padding: 25px 15px;

  background: var(--sidebar-bg);

  border-right: 1px solid #e5e7eb;

  box-shadow:
    3px 0 20px var(--shadow);

  display: flex;
  flex-direction: column;

  gap: 10px;

  z-index: 100;
}

.logo {
  margin-bottom: 20px;

  text-align: center;

  font-size: 22px;
  font-weight: 700;

  color: var(--text-color);
}

.menu-button {
  width: 100%;

  border: none;

  padding: 14px 15px;

  border-radius: 12px;

  background: var(--button-bg);
  color: var(--button-text);

  font-size: 16px;
  font-weight: 600;

  cursor: pointer;

  transition:
    transform 0.2s ease,
    filter 0.2s ease,
    background 0.2s ease;
}

.menu-button:hover {
  transform: translateY(-1px);
  filter: brightness(0.97);
}

.menu-button.active {
  background: var(--active-bg);
  color: var(--active-text);
}


/* =========================================
   메인
========================================= */

.main {
  flex: 1;

  min-width: 0;
  min-height: 100vh;

  padding: 30px;

  display: flex;

  justify-content: center;
  align-items: center;

  background: var(--bg-color);

  transition:
    background 0.3s ease;
}


/* =========================================
   화면
========================================= */

.screen {
  position: relative;

  display: none;

  width: 100%;
  max-width: 760px;

  min-height: 500px;

  padding: 70px 35px 55px;

  border-radius: 24px;

  background: var(--screen-bg);

  backdrop-filter: blur(15px);
  -webkit-backdrop-filter: blur(15px);

  box-shadow:
    0 15px 40px var(--shadow);

  text-align: center;

  color: var(--text-color);
}

.screen.active {
  display: flex;

  flex-direction: column;

  justify-content: center;
  align-items: center;
}


/* =========================================
   제목
========================================= */

.screen h1 {
  margin: 0 0 20px;

  font-size: 30px;

  color: var(--text-color);
}


/* =========================================
   전체화면 기본
========================================= */

.screen:fullscreen {
  width: 100vw;
  height: 100vh;

  max-width: none;
  min-height: 100vh;

  margin: 0;
  padding: 0;

  border-radius: 0;

  background: var(--bg-color);

  box-shadow: none;

  overflow: hidden;
}


/* =========================================
   전체화면 제목
========================================= */

.screen:fullscreen h1 {
  position: absolute;

  top: 30px;
  left: 50%;

  margin: 0;

  transform: translateX(-50%);

  font-size: 30px;

  white-space: nowrap;

  z-index: 20;
}


/* =========================================
   전체화면 시간

   시간만 정확히 중앙
========================================= */

.screen:fullscreen .display {
  position: fixed;

  left: 50%;
  top: 50%;

  width: auto;

  margin: 0;
  padding: 0;

  transform: translate(-50%, -50%);

  font-size: clamp(55px, 10vw, 120px);

  line-height: 1;

  white-space: nowrap;

  text-align: center;

  z-index: 10;
}


/* =========================================
   전체화면 버튼
========================================= */

.fullscreen-button {
  position: absolute;

  top: 20px;
  right: 20px;

  border: none;

  border-radius: 9px;

  padding: 9px 14px;

  background: var(--button-bg);
  color: var(--button-text);

  font-size: 13px;
  font-weight: 600;

  cursor: pointer;

  z-index: 100;

  transition:
    transform 0.2s ease,
    filter 0.2s ease;
}

.fullscreen-button:hover {
  transform: scale(1.04);

  filter: brightness(0.95);
}


/* =========================================
   현재시간
========================================= */

.clock-content {
  display: flex;

  flex-direction: column;

  align-items: center;
  justify-content: center;

  width: 100%;
}

.timezone-box {
  display: flex;

  flex-direction: column;

  align-items: center;

  margin-bottom: 10px;
}

.timezone-box label {
  margin-bottom: 8px;

  font-size: 14px;
}

.timezone-box select {
  min-width: 230px;

  padding: 11px 15px;

  border: 1px solid var(--border-color);

  border-radius: 10px;

  outline: none;

  background: var(--input-bg);
  color: var(--text-color);

  font-size: 15px;

  cursor: pointer;
}

.display {
  margin: 30px 0;

  color: var(--text-color);

  font-family: "choon.clock", sans-serif;

  font-size: 62px;
  font-weight: 700;

  line-height: 1;

  white-space: nowrap;

  text-align: center;
}


/* 날짜 */

.date {
  margin-top: -15px;

  font-size: 16px;
  font-weight: 500;

  color: var(--text-color);

  text-align: center;
}


/* =========================================
   전체화면 현재시간
========================================= */

.screen:fullscreen .timezone-box {
  position: absolute;

  top: 85px;
  left: 50%;

  transform: translateX(-50%);

  margin: 0;

  z-index: 20;
}

.screen:fullscreen .date {
  position: absolute;

  left: 50%;

  top: calc(50% + 75px);

  transform: translateX(-50%);

  margin: 0;

  white-space: nowrap;

  z-index: 20;
}


/* =========================================
   타이머 입력
========================================= */

.timer-inputs {
  display: flex;

  justify-content: center;
  align-items: center;

  gap: 12px;

  margin: 5px 0 25px;
}

.timer-input-box {
  display: flex;

  flex-direction: column;

  align-items: center;
}

.timer-input-box label {
  margin-bottom: 7px;

  font-size: 14px;
}

.timer-input-box input {
  width: 100px;

  padding: 14px 8px;

  border: 1px solid var(--border-color);

  border-radius: 10px;

  outline: none;

  background: var(--input-bg);
  color: var(--text-color);

  font-size: 22px;

  text-align: center;
}

.timer-input-box input:focus {
  border-color: var(--active-bg);
}

.colon {
  margin-top: 23px;

  font-size: 30px;
  font-weight: 700;
}


/* =========================================
   전체화면 타이머 입력
========================================= */

.screen:fullscreen .timer-inputs {
  position: absolute;

  left: 50%;
  bottom: 120px;

  transform: translateX(-50%);

  margin: 0;

  z-index: 20;
}


/* =========================================
   버튼
========================================= */

.buttons {
  width: 100%;

  display: flex;

  justify-content: center;
  align-items: center;

  gap: 10px;

  flex-wrap: wrap;
}

.buttons button {
  min-width: 110px;

  border: none;

  border-radius: 11px;

  padding: 12px 25px;

  font-size: 16px;
  font-weight: 600;

  cursor: pointer;

  transition:
    transform 0.2s ease,
    filter 0.2s ease;
}

.buttons button:hover {
  transform: translateY(-1px);

  filter: brightness(0.96);
}

.start-button {
  background: var(--active-bg);

  color: var(--active-text);
}

.reset-button {
  background: var(--button-bg);

  color: var(--button-text);

  border:
    1px solid var(--border-color) !important;
}


/* =========================================
   전체화면 버튼 영역
========================================= */

.screen:fullscreen .buttons {
  position: absolute;

  left: 50%;
  bottom: 45px;

  transform: translateX(-50%);

  width: auto;

  z-index: 20;
}


/* =========================================
   설정
========================================= */

.settings-screen {
  text-align: left;

  overflow-y: auto;
}

.settings-title {
  text-align: center;

  margin-bottom: 25px !important;
}

.setting-section {
  width: 100%;

  margin-bottom: 20px;

  padding: 25px;

  border-radius: 16px;

  background: var(--screen-bg);
}

.setting-section h2 {
  margin: 0 0 8px;

  font-size: 20px;
}

.setting-description {
  margin: 0 0 20px;

  font-size: 14px;
}


/* =========================================
   파스텔 색상
========================================= */

.pastel-colors {
  display: grid;

  grid-template-columns:
    repeat(5, 1fr);

  gap: 12px;
}

.pastel-color {
  width: 100%;

  aspect-ratio: 1 / 1;

  border: 3px solid transparent;

  border-radius: 14px;

  cursor: pointer;

  box-shadow:
    0 3px 8px rgba(0,0,0,0.08);

  transition:
    transform 0.15s ease,
    border-color 0.15s ease;
}

.pastel-color:hover {
  transform: scale(1.06);
}

.pastel-color.selected {
  border-color: #334155;

  box-shadow:
    0 0 0 2px white,
    0 0 0 4px #334155;
}

.pastel-pink {
  background: #ffd6e0;
}

.pastel-peach {
  background: #ffe0c2;
}

.pastel-yellow {
  background: #fff1b8;
}

.pastel-green {
  background: #d8f3dc;
}

.pastel-mint {
  background: #c7f9e9;
}

.pastel-sky {
  background: #cfe8ff;
}

.pastel-blue {
  background: #d9dcff;
}

.pastel-purple {
  background: #eadcff;
}

.pastel-lavender {
  background: #f0ddff;
}

.pastel-cream {
  background: #fff7df;
}


/* =========================================
   기본색 버튼
========================================= */

.default-background-button {
  display: block;

  margin: 20px auto 0;

  border: none;

  border-radius: 10px;

  padding: 11px 18px;

  background: var(--button-bg);
  color: var(--button-text);

  font-size: 14px;

  cursor: pointer;
}


/* =========================================
   언어
========================================= */

.language-select {
  width: 100%;

  padding: 13px 15px;

  border:
    1px solid var(--border-color);

  border-radius: 10px;

  outline: none;

  background: var(--input-bg);
  color: var(--text-color);

  font-size: 15px;

  cursor: pointer;
}


/* =========================================
   투명 태스크바
========================================= */

.taskbar {
  position: fixed;

  left: 210px;
  right: 0;
  bottom: 0;

  height: 45px;

  background: transparent;

  border: none;

  box-shadow: none;

  pointer-events: none;

  z-index: 5;
}


/* =========================================
   모바일
========================================= */

@media (max-width: 700px) {

  .layout {
    flex-direction: column;
  }

  .sidebar {
    width: 100%;
    min-height: auto;

    padding: 12px;

    flex-direction: row;

    flex-wrap: wrap;

    align-items: center;
  }

  .logo {
    width: 100%;

    margin-bottom: 5px;
  }

  .menu-button {
    flex: 1;

    min-width: 70px;

    padding: 10px 8px;

    font-size: 14px;
  }

  .main {
    min-height:
      calc(100vh - 100px);

    padding: 15px;
  }

  .screen {
    min-height: 450px;

    padding:
      60px 15px 40px;
  }

  .display {
    font-size: 42px;
  }

  .timer-inputs {
    gap: 5px;
  }

  .timer-input-box input {
    width: 80px;

    font-size: 20px;
  }

  .pastel-colors {
    gap: 8px;
  }

  .taskbar {
    left: 0;
  }

  .fullscreen-button {
    top: 15px;
    right: 15px;

    padding:
      8px 10px;
  }

  .screen:fullscreen .display {
    font-size:
      clamp(40px, 12vw, 80px);
  }
}


@media (max-width: 400px) {

  .display {
    font-size: 34px;
  }

  .timer-input-box input {
    width: 65px;
  }

  .timer-inputs {
    gap: 2px;
  }
}


/* =========================================
   갤럭시워치 전용 전체화면

   PC / 태블릿 / 휴대폰에는 적용하지 않습니다.
========================================= */

body.watch-device .screen:fullscreen {
  width: 100vw;
  height: 100vh;
  min-height: 100vh;
  max-width: none;
  padding: 0;
  margin: 0;
  border-radius: 0;
  overflow: hidden;
  background: var(--bg-color);
  color: var(--text-color);
  box-shadow: none;
}

/* 워치 전체화면의 X 버튼 */
body.watch-device .screen:fullscreen .fullscreen-button {
  top: max(8px, env(safe-area-inset-top));
  right: max(8px, env(safe-area-inset-right));
  width: 34px;
  height: 34px;
  padding: 0;
  border: 0;
  border-radius: 50%;
  background: transparent !important;
  color: var(--text-color);
  box-shadow: none !important;
  backdrop-filter: none !important;
  -webkit-backdrop-filter: none !important;
  font-size: 25px;
  font-weight: 700;
  line-height: 34px;
  z-index: 1000;
}

body.watch-device .screen:fullscreen .fullscreen-button:hover {
  transform: none;
  filter: none;
}

/* 워치에서는 전체화면 시간대 선택을 숨깁니다. */
body.watch-device #clock:fullscreen .timezone-box {
  display: none;
}

/* 워치 시계: 원 안에 제목 / 시간 / 날짜를 배치 */
body.watch-device #clock:fullscreen {
  display: flex;
  align-items: center;
  justify-content: center;
}

body.watch-device #clock:fullscreen::before {
  content: "";
  position: absolute;
  width: min(88vw, 88vh);
  height: min(88vw, 88vh);
  max-width: 340px;
  max-height: 340px;
  border-radius: 50%;
  border: 2px solid rgba(51,65,85,0.18);
  background: rgba(255,255,255,0.55);
  box-shadow: 0 8px 30px var(--shadow);
  pointer-events: none;
}

body.watch-device #clock:fullscreen h1 {
  top: 24%;
  left: 50%;
  transform: translateX(-50%);
  font-size: clamp(16px, 5vw, 25px);
  z-index: 30;
}

body.watch-device #clock:fullscreen .clock-content {
  position: relative;
  z-index: 20;
  width: 82vw;
  max-width: 300px;
  height: 82vw;
  max-height: 300px;
  display: flex;
  align-items: center;
  justify-content: center;
}

body.watch-device #clock:fullscreen .display {
  position: absolute;
  top: 48%;
  left: 50%;
  transform: translate(-50%, -50%);
  margin: 0;
  width: 100%;
  font-size: clamp(27px, 11vw, 62px);
  line-height: 1;
  white-space: nowrap;
  z-index: 21;
}

body.watch-device #clock:fullscreen .date {
  position: absolute;
  top: 68%;
  left: 50%;
  transform: translateX(-50%);
  width: 82%;
  margin: 0;
  font-size: clamp(10px, 3.5vw, 17px);
  line-height: 1.25;
  white-space: normal;
  z-index: 21;
}

/* 워치 타이머: 각 영역을 분리하여 겹치지 않게 */
body.watch-device #timer:fullscreen {
  display: flex;
  align-items: center;
  justify-content: center;
}

body.watch-device #timer:fullscreen h1,
body.watch-device #stopwatch:fullscreen h1 {
  top: 13%;
  font-size: clamp(17px, 5vw, 26px);
}

body.watch-device #timer:fullscreen .display,
body.watch-device #stopwatch:fullscreen .display {
  top: 42%;
  font-size: clamp(31px, 12vw, 68px);
}

body.watch-device #timer:fullscreen .timer-inputs {
  top: 58%;
  bottom: auto;
  width: 92vw;
  max-width: 330px;
  gap: 3px;
  margin: 0;
  z-index: 30;
}

body.watch-device #timer:fullscreen .timer-input-box input {
  width: clamp(45px, 17vw, 70px);
  padding: 7px 3px;
  font-size: clamp(15px, 5vw, 22px);
}

body.watch-device #timer:fullscreen .timer-input-box label {
  margin-bottom: 3px;
  font-size: clamp(9px, 3vw, 13px);
}

body.watch-device #timer:fullscreen .colon {
  margin-top: 18px;
  font-size: clamp(17px, 5vw, 25px);
}

/* 워치 초시계 */
body.watch-device #stopwatch:fullscreen {
  display: flex;
  align-items: center;
  justify-content: center;
}

body.watch-device #stopwatch:fullscreen .display {
  top: 46%;
}

/* 워치 전체화면의 시작/초기화 버튼 */
body.watch-device #timer:fullscreen .buttons,
body.watch-device #stopwatch:fullscreen .buttons {
  bottom: 13%;
  width: 92vw;
  max-width: 300px;
  gap: 7px;
}

body.watch-device #timer:fullscreen .buttons button,
body.watch-device #stopwatch:fullscreen .buttons button {
  min-width: 0;
  flex: 1;
  padding: 9px 8px;
  font-size: clamp(12px, 4vw, 17px);
}

@media (max-height: 430px) {
  body.watch-device #clock:fullscreen h1,
  body.watch-device #timer:fullscreen h1,
  body.watch-device #stopwatch:fullscreen h1 {
    top: 10%;
  }

  body.watch-device #clock:fullscreen .display {
    font-size: clamp(24px, 10vh, 48px);
  }

  body.watch-device #clock:fullscreen .date {
    top: 70%;
  }

  body.watch-device #timer:fullscreen .display,
  body.watch-device #stopwatch:fullscreen .display {
    top: 40%;
    font-size: clamp(28px, 14vh, 58px);
  }

  body.watch-device #timer:fullscreen .timer-inputs {
    top: 57%;
  }

  body.watch-device #timer:fullscreen .buttons,
  body.watch-device #stopwatch:fullscreen .buttons {
    bottom: 7%;
  }
}


/* 워치 전체화면: 타이머/초시계 영역을 완전히 분리 */
@media (max-width: 500px) {
  body.watch-device #timer:fullscreen,
  body.watch-device #stopwatch:fullscreen {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    min-height: 100vh;
    overflow: hidden;
  }

  body.watch-device #timer:fullscreen h1,
  body.watch-device #stopwatch:fullscreen h1 {
    position: absolute;
    top: 9vh;
    left: 50%;
    transform: translateX(-50%);
    margin: 0;
    width: 80vw;
    text-align: center;
    font-size: clamp(15px, 5vw, 23px);
    line-height: 1.15;
    white-space: nowrap;
    z-index: 40;
  }

  body.watch-device #timer:fullscreen .display,
  body.watch-device #stopwatch:fullscreen .display {
    position: absolute;
    top: 31vh;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 92vw;
    margin: 0;
    padding: 0;
    font-size: clamp(30px, 11vw, 58px);
    line-height: 1;
    white-space: nowrap;
    text-align: center;
    z-index: 30;
  }

  body.watch-device #timer:fullscreen .timer-inputs {
    position: absolute;
    top: 52vh;
    left: 50%;
    transform: translateX(-50%);
    width: 88vw;
    max-width: 310px;
    height: auto;
    margin: 0;
    padding: 0;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    gap: clamp(2px, 1vw, 6px);

  }

  body.watch-device #timer:fullscreen .timer-input-box {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
  }

  body.watch-device #timer:fullscreen .timer-input-box label {
    margin: 0 0 3px;
    font-size: clamp(8px, 2.8vw, 12px);
    line-height: 1;
    white-space: nowrap;
  }

  body.watch-device #timer:fullscreen .timer-input-box input {
    width: clamp(42px, 14vw, 58px);

    font-size: clamp(14px, 4.5vw, 20px);
    line-height: 1;
  }

  body.watch-device #timer:fullscreen .colon {
    margin: 0 0 8px;
    font-size: clamp(15px, 4.5vw, 21px);
    line-height: 1;
  }

  body.watch-device #timer:fullscreen .buttons,
  body.watch-device #stopwatch:fullscreen .buttons {
    position: absolute;
    left: 50%;
    bottom: 8vh;
    transform: translateX(-50%);
    width: 82vw;
    max-width: 270px;
    margin: 0;
    display: flex;
    justify-content: center;
    gap: 7px;
    z-index: 40;
  }

  body.watch-device #timer:fullscreen .buttons button,
  body.watch-device #stopwatch:fullscreen .buttons button {
    flex: 1 1 0;
    min-width: 0;
    height: clamp(36px, 11vw, 46px);
    padding: 4px 6px;
    font-size: clamp(11px, 3.7vw, 16px);
    line-height: 1;
    white-space: nowrap;
  }

  body.watch-device #stopwatch:fullscreen .display {
    top: 43vh;
  }

  @media (max-height: 430px) {
    body.watch-device #timer:fullscreen h1,
    body.watch-device #stopwatch:fullscreen h1 {
      top: 6vh;
    }

    body.watch-device #timer:fullscreen .display {
      top: 28vh;
    }

    body.watch-device #timer:fullscreen .timer-inputs {
      top: 50vh;
    }

    body.watch-device #stopwatch:fullscreen .display {
      top: 37vh;
    }

    body.watch-device #timer:fullscreen .buttons,
    body.watch-device #stopwatch:fullscreen .buttons {
      bottom: 5vh;
    }
  }
}


/* 워치 시계 전체화면: 겹침 방지를 위해 글자 크기를 우선 축소 */
body.watch-device #clock:fullscreen h1 {
  top: 25%;

   PC / 태블릿 / 휴대폰은 기존 스타일을 그대로 사용합니다.
========================================= */

function isGalaxyWatch() {
  const ua = navigator.userAgent || "";

  return /SM-R\d+/i.test(ua) ||
         /Tizen/i.test(ua) ||
         /Wear OS/i.test(ua) ||
         /Galaxy Watch/i.test(ua) ||
         /Samsung.*Watch/i.test(ua);
}

      "Выберите язык.",

    timerAlert:
      "Установите время таймера.",

    timerRangeAlert:
      "Часы должны быть от 0 до 23.",

    timerFinished:
      "Таймер завершён!"
  }

};


/* =========================================
   상태
========================================= */

let currentLanguage =
  localStorage.getItem("language") || "ko";


/* =========================================
   버튼 색상
========================================= */

const buttonColors = {

  "#ffd6e0": "#e89aaa",
  "#ffe0c2": "#e6a978",
  "#fff1b8": "#d8bd58",
  "#d8f3dc": "#82b58d",
  "#c7f9e9": "#65bda5",
  "#cfe8ff": "#79a9d6",
  "#d9dcff": "#7c83d9",
  "#eadcff": "#a17cc7",
  "#f0ddff": "#b18acb",
  "#fff7df": "#d5bd78",
  "#eef2ff": "#7c83d9"

};


/* =========================================
   화면 이동
========================================= */

function showScreen(screenName) {

  document
    .querySelectorAll(".screen")
    .forEach(screen => {

      screen.classList.remove("active");

    });


  document
    .querySelectorAll(".menu-button")
    .forEach(button => {

      button.classList.remove("active");

    });


  const screen =
    document.getElementById(screenName);


  const menuButton =
    document.getElementById(
      screenName + "Button"
    );


  if (screen) {
    screen.classList.add("active");
  }


  if (menuButton) {
    menuButton.classList.add("active");
  }

}


/* =========================================
   현재시간
========================================= */

function updateClock() {

  const timezone =
    document.getElementById(
      "timezone"
    ).value;


  const now = new Date();


  const localeMap = {

    ko: "ko-KR",
    en: "en-US",
    ja: "ja-JP",
    zh: "zh-CN",
    es: "es-ES",
    fr: "fr-FR",
    de: "de-DE",
    it: "it-IT",
    pt: "pt-PT",
    ru: "ru-RU"

  };


  const locale =
    localeMap[currentLanguage] ||
    "ko-KR";


  const timeText =
    new Intl.DateTimeFormat(
      locale,
      {
        timeZone: timezone,

        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",

        hour12:
          currentLanguage === "en"
      }
    ).format(now);


  const dateText =
    new Intl.DateTimeFormat(
      locale,
      {
        timeZone: timezone,

        year: "numeric",
        month: "long",
        day: "numeric",
        weekday: "long"
      }
    ).format(now);


  document.getElementById(
    "clockDisplay"
  ).textContent = timeText;


  document.getElementById(
    "dateDisplay"
  ).textContent = dateText;

}


setInterval(
  updateClock,
  1000
);


/* =========================================
   타이머
========================================= */

let timerTime = 0;

let timerInterval = null;

let timerRunning = false;


function updateTimer() {

  const hours =
    Math.floor(
      timerTime / 3600
    );


  const minutes =
    Math.floor(
      (timerTime % 3600) / 60
    );


  const seconds =
    timerTime % 60;


  document.getElementById(
    "timerDisplay"
  ).textContent =

    String(hours).padStart(2,"0")
    + ":" +

    String(minutes).padStart(2,"0")
    + ":" +

    String(seconds).padStart(2,"0");

}


function toggleTimer() {

  const button =
    document.getElementById(
      "timerStartButton"
    );


  const t =
    translations[currentLanguage];


  /* 정지 */

  if (timerRunning) {

    clearInterval(
      timerInterval
    );

    timerInterval = null;

    timerRunning = false;

    button.textContent =
      t.start;

    return;
  }


  /* 처음 시작할 때 입력값 읽기 */

  if (timerTime === 0) {

    const hours =
      Number(
        document.getElementById(
          "timerHours"
        ).value
      );


    const minutes =
      Number(
        document.getElementById(
          "timerMinutes"
        ).value
      );


    const seconds =
      Number(
        document.getElementById(
          "timerSeconds"
        ).value
      );


    if (
      hours < 0 ||
      hours > 23 ||
      minutes < 0 ||
      minutes > 59 ||
      seconds < 0 ||
      seconds > 59
    ) {

      alert(
        t.timerRangeAlert
      );

      return;
    }


    if (
      hours === 0 &&
      minutes === 0 &&
      seconds === 0
    ) {

      alert(
        t.timerAlert
      );

      return;
    }


    timerTime =
      hours * 3600 +
      minutes * 60 +
      seconds;


    updateTimer();

  }


  timerRunning = true;

  button.textContent =
    t.stop;


  timerInterval =
    setInterval(() => {

      timerTime--;

      updateTimer();


      if (timerTime <= 0) {

        clearInterval(
          timerInterval
        );

        timerInterval = null;

        timerRunning = false;

        timerTime = 0;

        updateTimer();


        button.textContent =
          translations[
            currentLanguage
          ].start;


        alert(
          translations[
            currentLanguage
          ].timerFinished
        );

      }

    },1000);

}


function resetTimer() {

  clearInterval(
    timerInterval
  );

  timerInterval = null;

  timerRunning = false;

  timerTime = 0;


  document.getElementById(
    "timerHours"
  ).value = 0;


  document.getElementById(
    "timerMinutes"
  ).value = 0;


  document.getElementById(
    "timerSeconds"
  ).value = 0;


  document.getElementById(
    "timerStartButton"
  ).textContent =
    translations[
      currentLanguage
    ].start;


  updateTimer();

}


/* =========================================
   초시계
========================================= */

let stopwatchRunning = false;

let stopwatchStartTime = 0;

let stopwatchElapsed = 0;

let stopwatchAnimation = null;


function updateStopwatch() {

  let totalMilliseconds;


  if (stopwatchRunning) {

    totalMilliseconds =
      stopwatchElapsed +
      (
        performance.now() -
        stopwatchStartTime
      );

  } else {

    totalMilliseconds =
      stopwatchElapsed;

  }


  const oneHour =
    60 * 60 * 1000;


  let displayText;


  /*
    1시간 미만

    분 : 초 : 밀리초
  */

  if (
    totalMilliseconds <
    oneHour
  ) {

    const minutes =
      Math.floor(
        totalMilliseconds /
        60000
      );


    const seconds =
      Math.floor(
        (
          totalMilliseconds %
          60000
        ) / 1000
      );


    const milliseconds =
      Math.floor(
        (
          totalMilliseconds %
          1000
        ) / 10
      );


    displayText =

      String(minutes)
        .padStart(2,"0")

      + ":" +

      String(seconds)
        .padStart(2,"0")

      + ":" +

      String(milliseconds)
        .padStart(2,"0");

  }


  /*
    1시간 이상

    시간 : 분 : 초
  */

  else {

    const hours =
      Math.floor(
        totalMilliseconds /
        3600000
      );


    const minutes =
      Math.floor(
        (
          totalMilliseconds %
          3600000
        ) / 60000
      );


    const seconds =
      Math.floor(
        (
          totalMilliseconds %
          60000
        ) / 1000
      );


    displayText =

      String(hours)
        .padStart(2,"0")

      + ":" +

      String(minutes)
        .padStart(2,"0")

      + ":" +

      String(seconds)
        .padStart(2,"0");

  }


  document.getElementById(
    "stopwatchDisplay"
  ).textContent =
    displayText;


  if (stopwatchRunning) {

    stopwatchAnimation =
      requestAnimationFrame(
        updateStopwatch
      );

  }

}


function toggleStopwatch() {

  const button =
    document.getElementById(
      "stopwatchStartButton"
    );


  const t =
    translations[currentLanguage];


  /* 정지 */

  if (stopwatchRunning) {

    stopwatchElapsed +=
      performance.now() -
      stopwatchStartTime;


    stopwatchRunning = false;

    stopwatchStartTime = 0;


    if (
      stopwatchAnimation !== null
    ) {

      cancelAnimationFrame(
        stopwatchAnimation
      );

      stopwatchAnimation = null;

    }


    button.textContent =
      t.start;


    updateStopwatch();

    return;
  }


  /* 시작 */

  stopwatchRunning = true;

  stopwatchStartTime =
    performance.now();


  button.textContent =
    t.stop;


  updateStopwatch();

}


function resetStopwatch() {

  if (
    stopwatchAnimation !== null
  ) {

    cancelAnimationFrame(
      stopwatchAnimation
    );

    stopwatchAnimation = null;

  }


  stopwatchRunning = false;

  stopwatchStartTime = 0;

  stopwatchElapsed = 0;


  document.getElementById(
    "stopwatchStartButton"
  ).textContent =
    translations[
      currentLanguage
    ].start;


  document.getElementById(
    "stopwatchDisplay"
  ).textContent =
    "00:00:00";

}


/* =========================================
   전체화면
========================================= */

async function toggleFullscreen(
  screenId
) {

  const screen =
    document.getElementById(
      screenId
    );


  if (!screen) {
    return;
  }


  /*
    전체화면 상태라면 나가기
  */

  if (
    document.fullscreenElement ||
    document.webkitFullscreenElement
  ) {

    try {

      if (
        document.exitFullscreen
      ) {

        await document.exitFullscreen();

      }

      else if (
        document.webkitExitFullscreen
      ) {

        document.webkitExitFullscreen();

      }

    }

    catch(error) {

      console.error(
        error
      );

    }

    return;
  }


  /*
    표준 Fullscreen API
  */

  if (
    screen.requestFullscreen
  ) {

    try {

      await screen.requestFullscreen();

    }

    catch(error) {

      console.error(
        "Fullscreen error:",
        error
      );

    }

    return;
  }


  /*
    Safari
  */

  if (
    screen.webkitRequestFullscreen
  ) {

    try {

      screen.webkitRequestFullscreen();

    }

    catch(error) {

      console.error(
        error
      );

    }

    return;
  }


  alert(
    "이 브라우저에서는 전체화면을 지원하지 않습니다."
  );

}


/* =========================================
   전체화면 버튼 글자
========================================= */

document.addEventListener(
  "fullscreenchange",
  updateFullscreenButtons
);


document.addEventListener(
  "webkitfullscreenchange",
  updateFullscreenButtons
);


function updateFullscreenButtons() {

  const t =
    translations[
      currentLanguage
    ];


  const isFullscreen =
    !!document.fullscreenElement ||
    !!document.webkitFullscreenElement;


  document
    .querySelectorAll(
      ".fullscreen-button"
    )
    .forEach(button => {

      button.textContent =
        isFullscreen
          ? (watchDevice ? "×" : t.exitFullscreen)
          : t.fullscreen;

    });

}


/* =========================================
   배경색
========================================= */

function setBackgroundColor(
  color,
  selectedButton = null
) {

  document.documentElement
    .style
    .setProperty(
      "--bg-color",
      color
    );


  const buttonColor =
    buttonColors[color] ||
    "#7c83d9";


  document.documentElement
    .style
    .setProperty(
      "--button-bg",
      color
    );


  document.documentElement
    .style
    .setProperty(
      "--active-bg",
      buttonColor
    );


  document
    .querySelectorAll(
      ".pastel-color"
    )
    .forEach(button => {

      button.classList.remove(
        "selected"
      );

    });


  if (selectedButton) {

    selectedButton.classList.add(
      "selected"
    );

  }

  else {

    const matchingButton =
      document.querySelector(
        '.pastel-color[data-color="' +
        color +
        '"]'
      );


    if (matchingButton) {

      matchingButton.classList.add(
        "selected"
      );

    }

  }


  localStorage.setItem(
    "backgroundColor",
    color
  );

}


function resetBackgroundColor() {

  setBackgroundColor(
    "#eef2ff"
  );

}
