<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#eef2ff">

<title>ChronoSpace</title>

<style>

/* =========================================
   카페24 슈퍼매직
========================================= */

@font-face {
  font-family: "Cafe24Supermagic";

  src:
    url("./Cafe24Supermagic-Regular.woff2")
    format("woff2");

  font-weight: 400;
  font-style: normal;

  font-display: swap;
}


/* =========================================
   기본 색상
========================================= */

:root {
  --bg-color: #eef2ff;
  --sidebar-bg: #ffffff;

  --text-color: #334155;

  --button-bg: #d9dcff;
  --button-text: #334155;

  --active-bg: #7c83d9;
  --active-text: #ffffff;

  --screen-bg: rgba(255,255,255,0.48);
  --input-bg: rgba(255,255,255,0.75);

  --border-color: rgba(51,65,85,0.20);

  --shadow: rgba(30,41,59,0.12);
}


/* =========================================
   기본
========================================= */

* {
  box-sizing: border-box;
}

html,
body {
  width: 100%;
  min-height: 100%;
  margin: 0;
}

body {
  min-height: 100vh;

  font-family:
    "Cafe24Supermagic",
    sans-serif;

  background: var(--bg-color);

  color: var(--text-color);

  overflow-x: hidden;

  transition:
    background 0.3s ease,
    color 0.3s ease;
}

button,
input,
select {
  font-family: inherit;
}


/* =========================================
   전체 레이아웃
========================================= */

.layout {
  display: flex;

  width: 100%;
  min-height: 100vh;
}


/* =========================================
   왼쪽 메뉴
========================================= */

.sidebar {
  width: 210px;
  min-height: 100vh;

  flex-shrink: 0;

  padding: 25px 15px;

  background: var(--sidebar-bg);

  border-right: 1px solid #e5e7eb;

  box-shadow:
    3px 0 20px var(--shadow);

  display: flex;
  flex-direction: column;

  gap: 10px;

  z-index: 100;
}

.logo {
  margin-bottom: 20px;

  text-align: center;

  font-size: 22px;
  font-weight: 700;

  color: var(--text-color);
}

.menu-button {
  width: 100%;

  border: none;

  padding: 14px 15px;

  border-radius: 12px;

  background: var(--button-bg);
  color: var(--button-text);

  font-size: 16px;
  font-weight: 600;

  cursor: pointer;

  transition:
    transform 0.2s ease,
    filter 0.2s ease,
    background 0.2s ease;
}

.menu-button:hover {
  transform: translateY(-1px);

  filter: brightness(0.97);
}

.menu-button.active {
  background: var(--active-bg);

  color: var(--active-text);
}


/* =========================================
   메인
========================================= */

.main {
  flex: 1;

  min-width: 0;
  min-height: 100vh;

  padding: 30px;

  display: flex;

  justify-content: center;
  align-items: center;

  background: var(--bg-color);

  transition:
    background 0.3s ease;
}


/* =========================================
   화면
========================================= */

.screen {
  position: relative;

  display: none;

  width: 100%;
  max-width: 760px;

  min-height: 500px;

  padding: 70px 35px 55px;

  border-radius: 24px;

  background: var(--screen-bg);

  backdrop-filter: blur(15px);
  -webkit-backdrop-filter: blur(15px);

  box-shadow:
    0 15px 40px var(--shadow);

  text-align: center;

  color: var(--text-color);
}

.screen.active {
  display: flex;

  flex-direction: column;

  justify-content: center;
  align-items: center;
}


/* =========================================
   제목
========================================= */

.screen h1 {
  margin: 0 0 20px;

  font-size: 30px;

  color: var(--text-color);
}


/* =========================================
   전체화면
========================================= */

.screen:fullscreen {
  width: 100vw;
  height: 100vh;

  max-width: none;
  min-height: 100vh;

  margin: 0;
  padding: 0;

  border-radius: 0;

  background: var(--bg-color);

  box-shadow: none;

  overflow: hidden;
}


/* 전체화면 제목 */

.screen:fullscreen h1 {
  position: absolute;

  top: 30px;
  left: 50%;

  margin: 0;

  transform: translateX(-50%);

  font-size: 30px;

  white-space: nowrap;

  z-index: 20;
}


/* 전체화면 시간 */

.screen:fullscreen .display {
  position: fixed;

  left: 50%;
  top: 50%;

  width: auto;

  margin: 0;
  padding: 0;

  transform: translate(-50%, -50%);

  font-size: clamp(55px, 10vw, 120px);

  line-height: 1;

  white-space: nowrap;

  text-align: center;

  z-index: 10;
}


/* =========================================
   전체화면 버튼
========================================= */

.fullscreen-button {
  position: absolute;

  top: 20px;
  right: 20px;

  border: none;

  border-radius: 9px;

  padding: 9px 14px;

  background: var(--button-bg);

  color: var(--button-text);

  font-size: 13px;
  font-weight: 600;

  cursor: pointer;

  z-index: 100;

  transition:
    transform 0.2s ease,
    filter 0.2s ease;
}

.fullscreen-button:hover {
  transform: scale(1.04);

  filter: brightness(0.95);
}


/* =========================================
   현재시간
========================================= */

.clock-content {
  display: flex;

  flex-direction: column;

  align-items: center;
  justify-content: center;

  width: 100%;
}

.timezone-box {
  display: flex;

  flex-direction: column;

  align-items: center;

  margin-bottom: 10px;
}

.timezone-box label {
  margin-bottom: 8px;

  font-size: 14px;
}

.timezone-box select {
  min-width: 230px;

  padding: 11px 15px;

  border: 1px solid var(--border-color);

  border-radius: 10px;

  outline: none;

  background: var(--input-bg);

  color: var(--text-color);

  font-size: 15px;

  cursor: pointer;
}

.display {
  margin: 30px 0;

  color: var(--text-color);

  font-family:
    "Cafe24Supermagic",
    sans-serif;

  font-size: 62px;
  font-weight: 700;

  line-height: 1;

  white-space: nowrap;

  text-align: center;
}

.date {
  margin-top: -15px;

  font-size: 16px;
  font-weight: 500;

  color: var(--text-color);

  text-align: center;
}


/* =========================================
   전체화면 현재시간
========================================= */

.screen:fullscreen .timezone-box {
  position: absolute;

  top: 85px;
  left: 50%;

  transform: translateX(-50%);

  margin: 0;

  z-index: 20;
}

.screen:fullscreen .date {
  position: absolute;

  left: 50%;

  top: calc(50% + 75px);

  transform: translateX(-50%);

  margin: 0;

  white-space: nowrap;

  z-index: 20;
}


/* =========================================
   타이머 입력
========================================= */

.timer-inputs {
  display: flex;

  justify-content: center;
  align-items: center;

  gap: 12px;

  margin: 5px 0 25px;
}

.timer-input-box {
  display: flex;

  flex-direction: column;

  align-items: center;
}

.timer-input-box label {
  margin-bottom: 7px;

  font-size: 14px;
}

.timer-input-box input {
  width: 100px;

  padding: 14px 8px;

  border: 1px solid var(--border-color);

  border-radius: 10px;

  outline: none;

  background: var(--input-bg);

  color: var(--text-color);

  font-size: 22px;

  text-align: center;
}

.timer-input-box input:focus {
  border-color: var(--active-bg);
}

.colon {
  margin-top: 23px;

  font-size: 30px;

  font-weight: 700;
}


/* =========================================
   전체화면 타이머
========================================= */

.screen:fullscreen .timer-inputs {
  position: absolute;

  left: 50%;
  bottom: 120px;

  transform: translateX(-50%);

  margin: 0;

  z-index: 20;
}


/* =========================================
   버튼
========================================= */

.buttons {
  width: 100%;

  display: flex;

  justify-content: center;
  align-items: center;

  gap: 10px;

  flex-wrap: wrap;
}

.buttons button {
  min-width: 110px;

  border: none;

  border-radius: 11px;

  padding: 12px 25px;

  font-size: 16px;

  font-weight: 600;

  cursor: pointer;

  transition:
    transform 0.2s ease,
    filter 0.2s ease;
}

.buttons button:hover {
  transform: translateY(-1px);

  filter: brightness(0.96);
}

.start-button {
  background: var(--active-bg);

  color: var(--active-text);
}

.reset-button {
  background: var(--button-bg);

  color: var(--button-text);

  border:
    1px solid var(--border-color) !important;
}


/* =========================================
   전체화면 버튼 영역
========================================= */

.screen:fullscreen .buttons {
  position: absolute;

  left: 50%;
  bottom: 45px;

  transform: translateX(-50%);

  width: auto;

  z-index: 20;
}


/* =========================================
   설정
========================================= */

.settings-screen {
  text-align: left;

  overflow-y: auto;
}

.settings-title {
  text-align: center;

  margin-bottom: 25px !important;
}

.setting-section {
  width: 100%;

  margin-bottom: 20px;

  padding: 25px;

  border-radius: 16px;

  background: var(--screen-bg);
}

.setting-section h2 {
  margin: 0 0 8px;

  font-size: 20px;
}

.setting-description {
  margin: 0 0 20px;

  font-size: 14px;
}


/* =========================================
   파스텔 색상
========================================= */

.pastel-colors {
  display: grid;

  grid-template-columns:
    repeat(5, 1fr);

  gap: 12px;
}

.pastel-color {
  width: 100%;

  aspect-ratio: 1 / 1;

  border: 3px solid transparent;

  border-radius: 14px;

  cursor: pointer;

  box-shadow:
    0 3px 8px rgba(0,0,0,0.08);

  transition:
    transform 0.15s ease,
    border-color 0.15s ease;
}

.pastel-color:hover {
  transform: scale(1.06);
}

.pastel-color.selected {
  border-color: #334155;

  box-shadow:
    0 0 0 2px white,
    0 0 0 4px #334155;
}

.pastel-pink {
  background: #ffd6e0;
}

.pastel-peach {
  background: #ffe0c2;
}

.pastel-yellow {
  background: #fff1b8;
}

.pastel-green {
  background: #d8f3dc;
}

.pastel-mint {
  background: #c7f9e9;
}

.pastel-sky {
  background: #cfe8ff;
}

.pastel-blue {
  background: #d9dcff;
}

.pastel-purple {
  background: #eadcff;
}

.pastel-lavender {
  background: #f0ddff;
}

.pastel-cream {
  background: #fff7df;
}


/* =========================================
   기본색 버튼
========================================= */

.default-background-button {
  display: block;

  margin: 20px auto 0;

  border: none;

  border-radius: 10px;

  padding: 11px 18px;

  background: var(--button-bg);

  color: var(--button-text);

  font-size: 14px;

  cursor: pointer;
}


/* =========================================
   언어
========================================= */

.language-select {
  width: 100%;

  padding: 13px 15px;

  border:
    1px solid var(--border-color);

  border-radius: 10px;

  outline: none;

  background: var(--input-bg);

  color: var(--text-color);

  font-size: 15px;

  cursor: pointer;
}


/* =========================================
   투명 태스크바
========================================= */

.taskbar {
  position: fixed;

  left: 210px;
  right: 0;
  bottom: 0;

  height: 45px;

  background: transparent;

  border: none;

  box-shadow: none;

  pointer-events: none;

  z-index: 5;
}


/* =========================================
   모바일
========================================= */

@media (max-width: 700px) {

  .layout {
    flex-direction: column;
  }

  .sidebar {
    width: 100%;
    min-height: auto;

    padding: 12px;

    flex-direction: row;

    flex-wrap: wrap;

    align-items: center;
  }

  .logo {
    width: 100%;

    margin-bottom: 5px;
  }

  .menu-button {
    flex: 1;

    min-width: 70px;

    padding: 10px 8px;

    font-size: 14px;
  }

  .main {
    min-height:
      calc(100vh - 100px);

    padding: 15px;
  }

  .screen {
    min-height: 450px;

    padding:
      60px 15px 40px;
  }

  .display {
    font-size: 42px;
  }

  .timer-inputs {
    gap: 5px;
  }

  .timer-input-box input {
    width: 80px;

    font-size: 20px;
  }

  .pastel-colors {
    gap: 8px;
  }

  .taskbar {
    left: 0;
  }

  .fullscreen-button {
    top: 15px;
    right: 15px;

    padding:
      8px 10px;
  }

  .screen:fullscreen .display {
    font-size:
      clamp(40px, 12vw, 80px);
  }
}


@media (max-width: 400px) {

  .display {
    font-size: 34px;
  }

  .timer-input-box input {
    width: 65px;
  }

  .timer-inputs {
    gap: 2px;
  }
}

</style>
</head>


<body>

<div class="layout">


  <!-- 왼쪽 메뉴 -->

  <aside class="sidebar">

    <div
      id="logo"
      class="logo">
      ChronoSpace
    </div>


    <button
      id="clockButton"
      class="menu-button active"
      onclick="showScreen('clock')">
      현재시간
    </button>


    <button
      id="timerButton"
      class="menu-button"
      onclick="showScreen('timer')">
      타이머
    </button>


    <button
      id="stopwatchButton"
      class="menu-button"
      onclick="showScreen('stopwatch')">
      초시계
    </button>


    <button
      id="settingsButton"
      class="menu-button"
      onclick="showScreen('settings')">
      설정
    </button>

  </aside>


  <!-- 메인 -->

  <main class="main">


    <!-- 현재시간 -->

    <section
      id="clock"
      class="screen active">


      <button
        id="clockFullscreenButton"
        class="fullscreen-button"
        onclick="toggleFullscreen('clock')">
        ⛶ 전체화면
      </button>


      <h1 id="clockTitle">
        현재시간
      </h1>


      <div class="timezone-box">

        <label
          id="timezoneLabel"
          for="timezone">
          시간대
        </label>


        <select
          id="timezone"
          onchange="updateClock()">

          <option value="Asia/Seoul">
            대한민국 (서울)
          </option>

          <option value="Asia/Tokyo">
            일본 (도쿄)
          </option>

          <option value="Asia/Shanghai">
            중국 (상하이)
          </option>

          <option value="Asia/Hong_Kong">
            홍콩
          </option>

          <option value="Asia/Singapore">
            싱가포르
          </option>

          <option value="Asia/Bangkok">
            태국 (방콕)
          </option>

          <option value="Asia/Jakarta">
            인도네시아 (자카르타)
          </option>

          <option value="Asia/Kolkata">
            인도 (뉴델리)
          </option>

          <option value="Asia/Dubai">
            아랍에미리트 (두바이)
          </option>

          <option value="Australia/Perth">
            호주 (퍼스)
          </option>

          <option value="Australia/Sydney">
            호주 (시드니)
          </option>

          <option value="Pacific/Auckland">
            뉴질랜드 (오클랜드)
          </option>

          <option value="Europe/London">
            영국 (런던)
          </option>

          <option value="Europe/Paris">
            프랑스 (파리)
          </option>

          <option value="Europe/Berlin">
            독일 (베를린)
          </option>

          <option value="Europe/Rome">
            이탈리아 (로마)
          </option>

          <option value="Europe/Moscow">
            러시아 (모스크바)
          </option>

          <option value="America/New_York">
            미국 (뉴욕)
          </option>

          <option value="America/Chicago">
            미국 (시카고)
          </option>

          <option value="America/Denver">
            미국 (덴버)
          </option>

          <option value="America/Los_Angeles">
            미국 (로스앤젤레스)
          </option>

          <option value="America/Toronto">
            캐나다 (토론토)
          </option>

          <option value="America/Vancouver">
            캐나다 (밴쿠버)
          </option>

          <option value="America/Mexico_City">
            멕시코 (멕시코시티)
          </option>

          <option value="America/Sao_Paulo">
            브라질 (상파울루)
          </option>

        </select>

      </div>


      <div class="clock-content">

        <div
          id="clockDisplay"
          class="display">
          00:00:00
        </div>


        <div
          id="dateDisplay"
          class="date">
          날짜
        </div>

      </div>

    </section>


    <!-- 타이머 -->

    <section
      id="timer"
      class="screen">


      <button
        id="timerFullscreenButton"
        class="fullscreen-button"
        onclick="toggleFullscreen('timer')">
        ⛶ 전체화면
      </button>


      <h1 id="timerTitle">
        타이머
      </h1>


      <div
        id="timerDisplay"
        class="display">
        00:00:00
      </div>


      <div class="timer-inputs">


        <div class="timer-input-box">

          <label
            id="hoursLabel"
            for="timerHours">
            시간
          </label>

          <input
            type="number"
            id="timerHours"
            min="0"
            max="23"
            value="0">

        </div>


        <div class="colon">
          :
        </div>


        <div class="timer-input-box">

          <label
            id="minutesLabel"
            for="timerMinutes">
            분
          </label>

          <input
            type="number"
            id="timerMinutes"
            min="0"
            max="59"
            value="0">

        </div>


        <div class="colon">
          :
        </div>


        <div class="timer-input-box">

          <label
            id="secondsLabel"
            for="timerSeconds">
            초
          </label>

          <input
            type="number"
            id="timerSeconds"
            min="0"
            max="59"
            value="0">

        </div>

      </div>


      <div class="buttons">

        <button
          id="timerStartButton"
          class="start-button"
          onclick="toggleTimer()">
          시작
        </button>


        <button
          id="timerResetButton"
          class="reset-button"
          onclick="resetTimer()">
          초기화
        </button>

      </div>

    </section>


    <!-- 초시계 -->

    <section
      id="stopwatch"
      class="screen">


      <button
        id="stopwatchFullscreenButton"
        class="fullscreen-button"
        onclick="toggleFullscreen('stopwatch')">
        ⛶ 전체화면
      </button>


      <h1 id="stopwatchTitle">
        초시계
      </h1>


      <div
        id="stopwatchDisplay"
        class="display">
        00:00:00
      </div>


      <div class="buttons">

        <button
          id="stopwatchStartButton"
          class="start-button"
          onclick="toggleStopwatch()">
          시작
        </button>


        <button
          id="stopwatchResetButton"
          class="reset-button"
          onclick="resetStopwatch()">
          초기화
        </button>

      </div>

    </section>


    <!-- 설정 -->

    <section
      id="settings"
      class="screen settings-screen">


      <h1
        id="settingsTitle"
        class="settings-title">
        설정
      </h1>


      <div class="setting-section">

        <h2 id="backgroundTitle">
          배경색
        </h2>


        <p
          id="backgroundDescription"
          class="setting-description">
          파스텔톤 색상 중에서 원하는 배경색을 선택하세요.
        </p>


        <div class="pastel-colors">

          <button
            class="pastel-color pastel-pink"
            data-color="#ffd6e0"
            onclick="setBackgroundColor('#ffd6e0', this)">
          </button>

          <button
            class="pastel-color pastel-peach"
            data-color="#ffe0c2"
            onclick="setBackgroundColor('#ffe0c2', this)">
          </button>

          <button
            class="pastel-color pastel-yellow"
            data-color="#fff1b8"
            onclick="setBackgroundColor('#fff1b8', this)">
          </button>

          <button
            class="pastel-color pastel-green"
            data-color="#d8f3dc"
            onclick="setBackgroundColor('#d8f3dc', this)">
          </button>

          <button
            class="pastel-color pastel-mint"
            data-color="#c7f9e9"
            onclick="setBackgroundColor('#c7f9e9', this)">
          </button>

          <button
            class="pastel-color pastel-sky"
            data-color="#cfe8ff"
            onclick="setBackgroundColor('#cfe8ff', this)">
          </button>

          <button
            class="pastel-color pastel-blue"
            data-color="#d9dcff"
            onclick="setBackgroundColor('#d9dcff', this)">
          </button>

          <button
            class="pastel-color pastel-purple"
            data-color="#eadcff"
            onclick="setBackgroundColor('#eadcff', this)">
          </button>

          <button
            class="pastel-color pastel-lavender"
            data-color="#f0ddff"
            onclick="setBackgroundColor('#f0ddff', this)">
          </button>

          <button
            class="pastel-color pastel-cream"
            data-color="#fff7df"
            onclick="setBackgroundColor('#fff7df', this)">
          </button>

function showScreen(screenName) {

  document
    .querySelectorAll(".screen")
    .forEach(screen => {

      screen.classList.remove("active");

    });


  document
    .querySelectorAll(".menu-button")
    .forEach(button => {

      button.classList.remove("active");

    });


  const screen =
    document.getElementById(screenName);


  const menuButton =
    document.getElementById(
      screenName + "Button"
    );


  if (screen) {
    screen.classList.add("active");
  }


  if (menuButton) {
    menuButton.classList.add("active");
  }

}


/* =========================================
   현재시간
========================================= */

function updateClock() {

  const timezone =
    document.getElementById(
      "timezone"
    ).value;


  const now = new Date();


  const localeMap = {

    ko: "ko-KR",
    en: "en-US",
    ja: "ja-JP",
    zh: "zh-CN",
    es: "es-ES",
    fr: "fr-FR",
    de: "de-DE",
    it: "it-IT",
    pt: "pt-PT",
    ru: "ru-RU"

  };


  const locale =
    localeMap[currentLanguage] ||
    "ko-KR";


  const timeText =
    new Intl.DateTimeFormat(
      locale,
      {
        timeZone: timezone,
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hour12:
          currentLanguage === "en"
      }
    ).format(now);


  const dateText =
    new Intl.DateTimeFormat(
      locale,
      {
        timeZone: timezone,
        year: "numeric",
        month: "long",
        day: "numeric",
        weekday: "long"
      }
    ).format(now);


  document.getElementById(
    "clockDisplay"
  ).textContent = timeText;


  document.getElementById(
    "dateDisplay"
  ).textContent = dateText;

}


setInterval(
  updateClock,
  1000
);


/* =========================================
   타이머
========================================= */

let timerTime = 0;

let timerInterval = null;

let timerRunning = false;


function updateTimer() {

  const hours =
    Math.floor(
      timerTime / 3600
    );


  const minutes =
    Math.floor(
      (timerTime % 3600) / 60
    );


  const seconds =
    timerTime % 60;


  document.getElementById(
    "timerDisplay"
  ).textContent =

    String(hours).padStart(2,"0")
    + ":" +

    String(minutes).padStart(2,"0")
    + ":" +

    String(seconds).padStart(2,"0");

}


function toggleTimer() {

  const button =
    document.getElementById(
      "timerStartButton"
    );


  const t =
    translations[currentLanguage];


  if (timerRunning) {

    clearInterval(
      timerInterval
    );

    timerInterval = null;

    timerRunning = false;

    button.textContent =
      t.start;

    return;
  }


  if (timerTime === 0) {

    const hours =
      Number(
        document.getElementById(
          "timerHours"
        ).value
      );


    const minutes =
      Number(
        document.getElementById(
          "timerMinutes"
        ).value
      );


    const seconds =
      Number(
        document.getElementById(
          "timerSeconds"
        ).value
      );


    if (
      hours < 0 ||
      hours > 23 ||
      minutes < 0 ||
      minutes > 59 ||
      seconds < 0 ||
      seconds > 59
    ) {

      alert(
        t.timerRangeAlert
      );

      return;
    }


    if (
      hours === 0 &&
      minutes === 0 &&
      seconds === 0
    ) {

      alert(
        t.timerAlert
      );

      return;
    }


    timerTime =
      hours * 3600 +
      minutes * 60 +
      seconds;


    updateTimer();

  }


  timerRunning = true;

  button.textContent =
    t.stop;


  timerInterval =
    setInterval(() => {

      timerTime--;

      updateTimer();


      if (timerTime <= 0) {

        clearInterval(
          timerInterval
        );

        timerInterval = null;

        timerRunning = false;

        timerTime = 0;

        updateTimer();


        button.textContent =
          translations[
            currentLanguage
          ].start;


        alert(
          translations[
            currentLanguage
          ].timerFinished
        );

      }

    },1000);

}


function resetTimer() {

  clearInterval(
    timerInterval
  );

  timerInterval = null;

  timerRunning = false;

  timerTime = 0;


  document.getElementById(
    "timerHours"
  ).value = 0;


  document.getElementById(
    "timerMinutes"
  ).value = 0;


  document.getElementById(
    "timerSeconds"
  ).value = 0;


  document.getElementById(
    "timerStartButton"
  ).textContent =
    translations[
      currentLanguage
    ].start;


  updateTimer();

}


/* =========================================
   초시계
========================================= */

let stopwatchRunning = false;

let stopwatchStartTime = 0;

let stopwatchElapsed = 0;

let stopwatchAnimation = null;


function updateStopwatch() {

  let totalMilliseconds;


  if (stopwatchRunning) {

    totalMilliseconds =
      stopwatchElapsed +
      (
        performance.now() -
        stopwatchStartTime
      );

  } else {

    totalMilliseconds =
      stopwatchElapsed;

  }


  const oneHour =
    60 * 60 * 1000;


  let displayText;


  if (
    totalMilliseconds <
    oneHour
  ) {

    const minutes =
      Math.floor(
        totalMilliseconds /
        60000
      );


    const seconds =
      Math.floor(
        (
          totalMilliseconds %
          60000
        ) / 1000
      );


    const milliseconds =
      Math.floor(
        (
          totalMilliseconds %
          1000
        ) / 10
      );


    displayText =

      String(minutes)
        .padStart(2,"0")

      + ":" +

      String(seconds)
        .padStart(2,"0")

      + ":" +

      String(milliseconds)
        .padStart(2,"0");

  }

  else {

    const hours =
      Math.floor(
        totalMilliseconds /
        3600000
      );


    const minutes =
      Math.floor(
        (
          totalMilliseconds %
          3600000
        ) / 60000
      );


    const seconds =
      Math.floor(
        (
          totalMilliseconds %
          60000
        ) / 1000
      );


    displayText =

      String(hours)
        .padStart(2,"0")

      + ":" +

      String(minutes)
        .padStart(2,"0")

      + ":" +

      String(seconds)
        .padStart(2,"0");

  }


  document.getElementById(
    "stopwatchDisplay"
  ).textContent =
    displayText;


  if (stopwatchRunning) {

    stopwatchAnimation =
      requestAnimationFrame(
        updateStopwatch
      );

  }

}


function toggleStopwatch() {

  const button =
    document.getElementById(
      "stopwatchStartButton"
    );


  const t =
    translations[currentLanguage];


  if (stopwatchRunning) {

    stopwatchElapsed +=
      performance.now() -
      stopwatchStartTime;


    stopwatchRunning = false;

    stopwatchStartTime = 0;


    if (
      stopwatchAnimation !== null
    ) {

      cancelAnimationFrame(
        stopwatchAnimation
      );

      stopwatchAnimation = null;

    }


    button.textContent =
      t.start;


    updateStopwatch();

    return;
  }


  stopwatchRunning = true;

  stopwatchStartTime =
    performance.now();


  button.textContent =
    t.stop;


  updateStopwatch();

}


function resetStopwatch() {

  if (
    stopwatchAnimation !== null
  ) {

    cancelAnimationFrame(
      stopwatchAnimation
    );

    stopwatchAnimation = null;

  }


  stopwatchRunning = false;

  stopwatchStartTime = 0;

  stopwatchElapsed = 0;


  document.getElementById(
    "stopwatchStartButton"
  ).textContent =
    translations[
      currentLanguage
    ].start;


  document.getElementById(
    "stopwatchDisplay"
  ).textContent =
    "00:00:00";

}


/* =========================================
   전체화면
========================================= */

async function toggleFullscreen(
  screenId
) {

  const screen =
    document.getElementById(
      screenId
    );


  if (!screen) {
    return;
  }


  if (
    document.fullscreenElement ||
    document.webkitFullscreenElement
  ) {

    try {

      if (
        document.exitFullscreen
      ) {

        await document.exitFullscreen();

      }

      else if (
        document.webkitExitFullscreen
      ) {

        document.webkitExitFullscreen();

      }

    }

    catch(error) {

      console.error(error);

    }

    return;
  }


  if (
    screen.requestFullscreen
  ) {

    try {

      await screen.requestFullscreen();

    }

    catch(error) {

      console.error(
        "Fullscreen error:",
        error
      );

    }

    return;
  }


  if (
    screen.webkitRequestFullscreen
  ) {

    try {

      screen.webkitRequestFullscreen();

    }

    catch(error) {

      console.error(error);

    }

    return;
  }


  alert(
    "이 브라우저에서는 전체화면을 지원하지 않습니다."
  );

}

}

  document.documentElement

      "--bg-color",
      color

  const buttonColor =
    buttonColors[color] ||
    "#7c83d9";


  document.documentElement

    .setProperty(
      "--button-bg",
      color
    );


  document.documentElement
    .style
    .setProperty(
      "--active-bg",
      buttonColor
    );


  document
    .querySelectorAll(
      ".pastel-color"
    )
    .forEach(button => {

      button.classList.remove(
        "selected"
      );

    });


  if (selectedButton) {

    selectedButton.classList.add(
      "selected"
    );

  }

  else {

    const matchingButton =
      document.querySelector(
        '.pastel-color[data-color="' +
        color +
        '"]'
      );


    if (matchingButton) {

      matchingButton.classList.add(
        "selected"
      );

    }

  }


  localStorage.setItem(
    "backgroundColor",
    color
  );

}

  setBackgroundColor(
    "#eef2ff"
  );

}
